<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>어둠의 숲 — 괴물에게서 도망쳐라</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0d14; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; touch-action:none; }
  #wrap { position:relative; width:100%; height:100%; }
  canvas { display:block; width:100%; height:100%; }

  /* ── HUD ── */
  #hud { position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
  .bars { width:min(46vw,260px); }
  .bar-label { color:#cfd6e4; font-size:12px; letter-spacing:2px; margin-bottom:3px; text-shadow:0 1px 3px #000; display:flex; justify-content:space-between; }
  .bar { height:14px; border-radius:7px; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18); overflow:hidden; margin-bottom:8px; }
  .bar > div { height:100%; border-radius:7px; transition:width .15s linear; }
  #hpFill { background:linear-gradient(90deg,#ff4d5e,#ff8a6b); width:100%; }
  #hgFill { background:linear-gradient(90deg,#e8a53a,#ffd977); width:100%; }
  #score { text-align:right; color:#eef2fa; text-shadow:0 1px 4px #000; }
  #score .t { font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; }
  #score .d { font-size:12px; color:#9fb0c8; letter-spacing:1px; }
  #dangerVeil { position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 120px 40px rgba(255,30,50,0); transition:box-shadow .2s; }

  /* ── 오버레이 ── */
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(5,7,12,.82); backdrop-filter:blur(3px); color:#eef2fa; text-align:center; padding:24px; }
  .overlay h1 { font-size:clamp(28px,6vw,52px); font-weight:900; letter-spacing:-1px; margin-bottom:10px; }
  .overlay h1 span { color:#ff5a6a; }
  .overlay p { color:#aab7cc; font-size:14px; line-height:1.9; margin-bottom:22px; }
  .overlay .keys { color:#ffd977; }
  .overlay button { pointer-events:auto; font-family:inherit; font-size:18px; font-weight:800; padding:14px 44px; border-radius:12px; border:none; cursor:pointer; background:linear-gradient(180deg,#ff6b5e,#e0392f); color:#fff; box-shadow:0 6px 20px rgba(224,57,47,.45); transition:transform .1s; }
  .overlay button:active { transform:scale(.95); }
  #resultStats { font-size:16px; color:#eef2fa; margin-bottom:20px; line-height:2; }
  #bestLine { color:#ffd977; font-weight:700; }
  .hidden { display:none !important; }

  /* ── 발사 버튼 ── */
  #fireBtn { position:absolute; right:24px; bottom:32px; width:78px; height:78px; border-radius:50%; border:2px solid rgba(255,255,255,.3); background:rgba(255,90,60,.35); color:#fff; font-size:30px; display:none; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; }
  #fireBtn:active { background:rgba(255,90,60,.65); }
  #gunMsg { position:absolute; top:24%; left:0; right:0; text-align:center; color:#ffd977; font-size:clamp(18px,4vw,28px); font-weight:900; text-shadow:0 2px 8px #000; pointer-events:none; opacity:0; transition:opacity .4s; }

  /* ── 모바일 조이스틱 ── */
  #stick { position:absolute; width:120px; height:120px; border-radius:50%; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.06); display:none; pointer-events:none; }
  #knob { position:absolute; width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.35); left:34px; top:34px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="dangerVeil"></div>

  <div id="hud">
    <div class="bars">
      <div class="bar-label"><span>❤ 체력</span><span id="hpTxt">100</span></div>
      <div class="bar"><div id="hpFill"></div></div>
      <div class="bar-label"><span>🍖 배고픔</span><span id="hgTxt">100</span></div>
      <div class="bar"><div id="hgFill"></div></div>
    </div>
    <div id="score">
      <div class="t" id="timeTxt">0.0초</div>
      <div class="d">생존 시간</div>
    </div>
  </div>

  <div id="stick"><div id="knob"></div></div>
  <div id="fireBtn">🔫</div>
  <div id="gunMsg">🔫 총이 나타났다! 주워서 괴물을 처치하라!</div>

  <div class="overlay" id="startOv">
    <h1>어둠의 숲 <span>괴물 탈출</span></h1>
    <p>
      괴물이 당신을 쫓아옵니다. 최대한 오래 살아남으세요!<br>
      <span class="keys">WASD / 방향키</span> 이동 · <span class="keys">Shift</span> 달리기 (배고픔 소모 ↑)<br>
      🍖 음식을 먹어 배고픔을 채우세요 — 배고픔이 0이 되면 체력이 줄어듭니다<br>
      💊 붕대를 먹으면 체력 회복 · 괴물에게 닿으면 큰 피해!<br>
      🔫 <span class="keys">60초</span>를 버티면 총이 나타납니다 — <span class="keys">스페이스/클릭</span>으로 발사해 괴물 처치!<br>
      📱 모바일: 화면을 눌러 조이스틱 이동 · 🔫 버튼으로 발사
    </p>
    <button id="startBtn">게임 시작</button>
  </div>

  <div class="overlay hidden" id="overOv">
    <h1><span>사망...</span></h1>
    <div id="resultStats"></div>
    <button id="retryBtn">다시 도전</button>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener('resize', resize); resize();
const vw = () => innerWidth, vh = () => innerHeight;

// ── 사운드 (Web Audio 합성) ──
let AC = null;
function audio(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }
function beep(f, dur, type='sine', vol=.15, slide=0){
  if(!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), AC.currentTime+dur);
  g.gain.value = vol; g.gain.exponentialRampToValueAtTime(.001, AC.currentTime+dur);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
}
const sfx = {
  eat(){ beep(600,.12,'square',.12,300); setTimeout(()=>beep(900,.1,'square',.1,200),70); },
  heal(){ beep(500,.15,'sine',.15,400); setTimeout(()=>beep(800,.2,'sine',.12,300),100); },
  hit(){ beep(160,.25,'sawtooth',.25,-100); },
  growl(){ beep(70,.4,'sawtooth',.12,-30); },
  starve(){ beep(220,.15,'triangle',.1,-80); },
  dead(){ beep(300,.5,'sawtooth',.2,-250); setTimeout(()=>beep(150,.8,'sawtooth',.18,-120),200); },
  gunSpawn(){ beep(400,.15,'square',.15,200); setTimeout(()=>beep(600,.15,'square',.15,200),120); setTimeout(()=>beep(900,.25,'square',.15,300),240); },
  pickup(){ beep(700,.1,'square',.15,500); setTimeout(()=>beep(1200,.15,'square',.12,300),80); },
  shoot(){ beep(900,.08,'square',.2,-700); beep(200,.1,'sawtooth',.15,-100); },
  monHit(){ beep(300,.12,'sawtooth',.18,-150); },
  win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.3,'square',.15),i*130)); }
};

// ── 게임 상태 ──
const MAP = 2400;                 // 맵 크기 (정사각형)
let player, monster, foods, meds, trees, particles;
let gun, gunSpawned, hasGun, ammo, bullets, fireCd;
let hp, hunger, time, running=false, last=0, shake=0, best=0;
const keys = {};

function reset(){
  player = { x:MAP/2, y:MAP/2, r:14, spd:210, face:1 };
  monster = { x:MAP/2+600, y:MAP/2+600, r:24, spd:150, growlT:0, hp:100, maxHp:100, hurtT:0 };
  foods = []; meds = []; particles = [];
  gun = null; gunSpawned = false; hasGun = false; ammo = 0; bullets = []; fireCd = 0;
  document.getElementById('fireBtn').style.display = 'none';
  document.getElementById('gunMsg').style.opacity = 0;
  trees = [];
  for(let i=0;i<60;i++){
    const t = { x:Math.random()*MAP, y:Math.random()*MAP, r:16+Math.random()*14 };
    if(Math.hypot(t.x-player.x,t.y-player.y)>120) trees.push(t);
  }
  for(let i=0;i<30;i++) spawnFood();
  for(let i=0;i<3;i++) spawnMed();
  hp = 100; hunger = 100; time = 0; shake = 0;
}
function spawnFood(){ foods.push({ x:60+Math.random()*(MAP-120), y:60+Math.random()*(MAP-120), bob:Math.random()*6 }); }
function spawnMed(){ meds.push({ x:60+Math.random()*(MAP-120), y:60+Math.random()*(MAP-120), bob:Math.random()*6 }); }
function burst(x,y,color,n=14){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 60+Math.random()*160;
    particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:.5+Math.random()*.4, max:1, color });
  }
}

// ── 입력 ──
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// 발사 (자동 조준: 괴물 방향으로 발사)
function tryFire(){
  if(!running || !hasGun || ammo<=0 || fireCd>0 || monster.hp<=0) return;
  fireCd = .3; ammo--;
  const a = Math.atan2(monster.y-player.y, monster.x-player.x);
  bullets.push({ x:player.x+Math.cos(a)*18, y:player.y+Math.sin(a)*18, vx:Math.cos(a)*760, vy:Math.sin(a)*760, life:1.2 });
  sfx.shoot(); shake = Math.max(shake,3);
}
addEventListener('keydown', e => { if(e.key===' ') tryFire(); });
cv.addEventListener('mousedown', tryFire);
const fireBtn = document.getElementById('fireBtn');
fireBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); tryFire(); }, {passive:false});

// 모바일 조이스틱
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let joy = null;
addEventListener('touchstart', e => {
  if(!running) return;
  const t = e.touches[0];
  joy = { id:t.identifier, ox:t.clientX, oy:t.clientY, dx:0, dy:0 };
  stick.style.display='block';
  stick.style.left = (t.clientX-60)+'px'; stick.style.top = (t.clientY-60)+'px';
}, {passive:true});
addEventListener('touchmove', e => {
  if(!joy) return;
  for(const t of e.touches){
    if(t.identifier===joy.id){
      let dx = t.clientX-joy.ox, dy = t.clientY-joy.oy;
      const d = Math.hypot(dx,dy), m = 46;
      if(d>m){ dx=dx/d*m; dy=dy/d*m; }
      joy.dx = dx/m; joy.dy = dy/m;
      knob.style.left = (34+dx)+'px'; knob.style.top = (34+dy)+'px';
    }
  }
}, {passive:true});
addEventListener('touchend', e => {
  if(joy && ![...e.touches].some(t=>t.identifier===joy.id)){
    joy=null; stick.style.display='none'; knob.style.left='34px'; knob.style.top='34px';
  }
});

// ── 업데이트 ──
function update(dt){
  time += dt;

  // 입력 → 이동
  let ix=0, iy=0;
  if(keys['w']||keys['arrowup']) iy--;
  if(keys['s']||keys['arrowdown']) iy++;
  if(keys['a']||keys['arrowleft']) ix--;
  if(keys['d']||keys['arrowright']) ix++;
  if(joy){ ix = joy.dx; iy = joy.dy; }
  const mag = Math.hypot(ix,iy);
  const sprint = (keys['shift'] || (joy && mag>.92)) && hunger>0;
  const spd = player.spd * (sprint?1.55:1);
  if(mag>0){
    player.x += ix/Math.max(mag,1)*spd*dt;
    player.y += iy/Math.max(mag,1)*spd*dt;
    if(ix!==0) player.face = ix>0?1:-1;
  }
  player.x = Math.max(20, Math.min(MAP-20, player.x));
  player.y = Math.max(20, Math.min(MAP-20, player.y));

  // 나무 충돌 (밀어내기)
  for(const t of trees){
    const dx=player.x-t.x, dy=player.y-t.y, d=Math.hypot(dx,dy), min=t.r+player.r-6;
    if(d<min && d>0){ player.x = t.x+dx/d*min; player.y = t.y+dy/d*min; }
  }

  // 배고픔 감소 (달리면 3배)
  hunger -= dt * (sprint && mag>0 ? 6.5 : 2.2);
  if(hunger <= 0){
    hunger = 0;
    hp -= dt*7;                        // 굶주림 피해
    if(Math.random()<dt*2) sfx.starve();
  }

  // 60초 경과 → 총 등장!
  if(!gunSpawned && time >= 60){
    gunSpawned = true;
    // 괴물 반대 방향으로 조금 떨어진 곳에 스폰
    const ga = Math.atan2(player.y-monster.y, player.x-monster.x);
    gun = { x:Math.max(60,Math.min(MAP-60, player.x+Math.cos(ga)*260)),
            y:Math.max(60,Math.min(MAP-60, player.y+Math.sin(ga)*260)), bob:0 };
    sfx.gunSpawn();
    const msg = document.getElementById('gunMsg');
    msg.style.opacity = 1;
    setTimeout(()=>msg.style.opacity=0, 3000);
  }
  // 총 획득
  if(gun && Math.hypot(gun.x-player.x, gun.y-player.y) < player.r+18){
    gun = null; hasGun = true; ammo = 15;
    sfx.pickup(); burst(player.x, player.y, '#7fd4ff');
    if('ontouchstart' in window) document.getElementById('fireBtn').style.display = 'flex';
  }
  fireCd = Math.max(0, fireCd-dt);

  // 총알
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if(b.life<=0){ bullets.splice(i,1); continue; }
    if(monster.hp>0 && Math.hypot(b.x-monster.x, b.y-monster.y) < monster.r+6){
      bullets.splice(i,1);
      monster.hp -= 12;
      monster.hurtT = .15;
      sfx.monHit(); burst(b.x, b.y, '#ff8a6b', 8);
      // 피격 넉백
      const kd = Math.hypot(b.vx,b.vy);
      monster.x += b.vx/kd*24; monster.y += b.vy/kd*24;
      if(monster.hp <= 0){ burst(monster.x, monster.y, '#ff4d5e', 40); victory(); return; }
    }
  }
  monster.hurtT = Math.max(0, monster.hurtT-dt);

  // 괴물 AI: 점점 빨라짐 + 추격
  monster.spd = 150 + time*2.2;
  const mdx = player.x-monster.x, mdy = player.y-monster.y, md = Math.hypot(mdx,mdy);
  if(md>1){ monster.x += mdx/md*monster.spd*dt; monster.y += mdy/md*monster.spd*dt; }
  monster.growlT -= dt;
  if(md<300 && monster.growlT<=0){ sfx.growl(); monster.growlT = 1.2; }

  // 괴물 접촉 피해
  if(md < monster.r+player.r){
    hp -= dt*45;
    shake = 8;
    if(Math.random()<dt*6) sfx.hit();
    burst(player.x, player.y, '#ff4d5e', 3);
    // 넉백
    if(md>1){ player.x += mdx/md*160*dt*3; player.y += mdy/md*160*dt*3; }
  }

  // 음식/붕대 획득
  for(let i=foods.length-1;i>=0;i--){
    const f=foods[i];
    if(Math.hypot(f.x-player.x,f.y-player.y) < player.r+14){
      foods.splice(i,1); hunger = Math.min(100, hunger+28);
      sfx.eat(); burst(f.x,f.y,'#ffd977');
      spawnFood(); spawnFood(); spawnFood(); // 먹을 때마다 3개 리스폰
    }
  }
  // 1초마다 자동으로 음식 1개 추가 스폰 (최대 60개)
  if(foods.length < 60 && Math.random() < dt) spawnFood();
  for(let i=meds.length-1;i>=0;i--){
    const m=meds[i];
    if(Math.hypot(m.x-player.x,m.y-player.y) < player.r+14){
      meds.splice(i,1); hp = Math.min(100, hp+25);
      sfx.heal(); burst(m.x,m.y,'#6bffb0');
      setTimeout(spawnMed, 2500);
    }
  }
  // 붕대가 부족하면 주기적으로 보충 (최소 2개 유지)
  if(meds.length < 2 && Math.random() < dt*.5) spawnMed();

  // 파티클
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.94; p.vy*=.94;
    if(p.life<=0) particles.splice(i,1);
  }
  shake = Math.max(0, shake - dt*20);

  // HUD
  document.getElementById('hpFill').style.width = Math.max(0,hp)+'%';
  document.getElementById('hgFill').style.width = Math.max(0,hunger)+'%';
  document.getElementById('hpTxt').textContent = Math.ceil(Math.max(0,hp));
  document.getElementById('hgTxt').textContent = Math.ceil(hunger);
  document.getElementById('timeTxt').textContent = time.toFixed(1)+'초';
  document.querySelector('#score .d').textContent = hasGun ? `생존 시간 · 🔫 ${ammo}발` : '생존 시간';
  const danger = md<260 ? (1-md/260) : 0;
  document.getElementById('dangerVeil').style.boxShadow = `inset 0 0 120px 40px rgba(255,30,50,${(danger*.55).toFixed(2)})`;

  if(hp<=0) gameOver(md < monster.r+player.r+30);
}

// ── 렌더 ──
function draw(){
  const camX = player.x - vw()/2 + (Math.random()-.5)*shake;
  const camY = player.y - vh()/2 + (Math.random()-.5)*shake;

  // 배경
  ctx.fillStyle = '#0e1420';
  ctx.fillRect(0,0,vw(),vh());

  ctx.save();
  ctx.translate(-camX,-camY);

  // 바닥 그리드 & 맵 경계
  ctx.strokeStyle = 'rgba(255,255,255,.045)';
  ctx.lineWidth = 1;
  const g=120;
  for(let x=Math.floor(camX/g)*g; x<camX+vw()+g; x+=g){ ctx.beginPath(); ctx.moveTo(x,camY); ctx.lineTo(x,camY+vh()); ctx.stroke(); }
  for(let y=Math.floor(camY/g)*g; y<camY+vh()+g; y+=g){ ctx.beginPath(); ctx.moveTo(camX,y); ctx.lineTo(camX+vw(),y); ctx.stroke(); }
  ctx.strokeStyle = '#3a2430'; ctx.lineWidth = 6;
  ctx.strokeRect(0,0,MAP,MAP);

  const now = performance.now()/1000;

  // 음식
  for(const f of foods){
    const b = Math.sin(now*3+f.bob)*4;
    ctx.font = '22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🍖', f.x, f.y+b);
  }
  // 붕대
  for(const m of meds){
    const b = Math.sin(now*3+m.bob)*4;
    ctx.font = '22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('💊', m.x, m.y+b);
  }

  // 나무
  for(const t of trees){
    ctx.fillStyle = '#1c2b22';
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#263d2e';
    ctx.beginPath(); ctx.arc(t.x-t.r*.25, t.y-t.r*.25, t.r*.65, 0, 7); ctx.fill();
  }

  // 총 아이템 (반짝임)
  if(gun){
    const b = Math.sin(now*4)*5;
    ctx.save();
    ctx.translate(gun.x, gun.y+b);
    ctx.shadowColor = '#7fd4ff'; ctx.shadowBlur = 18 + Math.sin(now*6)*8;
    ctx.font = '30px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🔫', 0, 0);
    ctx.restore();
  }

  // 총알
  ctx.fillStyle = '#ffe9a0';
  for(const b of bullets){
    ctx.save();
    ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx));
    ctx.shadowColor='#ffcf5e'; ctx.shadowBlur=8;
    ctx.fillRect(-8,-2.5,16,5);
    ctx.restore();
  }

  // 플레이어
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.scale(player.face, 1);
  ctx.font = '28px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🏃', 0, 0);
  if(hasGun) ctx.fillText('🔫', 16, 6);
  ctx.restore();

  // 괴물 (맥동 + 눈)
  const pulse = 1 + Math.sin(now*6)*.06;
  ctx.save();
  ctx.translate(monster.x, monster.y);
  ctx.scale(pulse, pulse);
  const grd = ctx.createRadialGradient(0,0,4, 0,0,monster.r+14);
  grd.addColorStop(0,'#5a1030'); grd.addColorStop(1,'rgba(90,16,48,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(0,0,monster.r+14,0,7); ctx.fill();
  ctx.font = '46px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(monster.hurtT>0){ ctx.shadowColor='#fff'; ctx.shadowBlur=25; }
  ctx.fillText('👹', 0, 0);
  ctx.restore();

  // 괴물 HP바 (총 획득 후 표시)
  if(hasGun && monster.hp>0){
    const bw = 64;
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(monster.x-bw/2, monster.y-monster.r-24, bw, 8);
    ctx.fillStyle = '#ff4d5e';
    ctx.fillRect(monster.x-bw/2, monster.y-monster.r-24, bw*Math.max(0,monster.hp/monster.maxHp), 8);
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1;
    ctx.strokeRect(monster.x-bw/2, monster.y-monster.r-24, bw, 8);
  }

  // 파티클
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,3.2,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // 화면 밖 괴물 방향 표시
  const sx = monster.x-camX, sy = monster.y-camY;
  if(sx<0||sx>vw()||sy<0||sy>vh()){
    const cx=vw()/2, cy=vh()/2;
    const a = Math.atan2(monster.y-player.y, monster.x-player.x);
    const ix = cx + Math.cos(a)*(Math.min(cx,cy)-40);
    const iy = cy + Math.sin(a)*(Math.min(cx,cy)-40);
    ctx.save();
    ctx.translate(ix,iy); ctx.rotate(a);
    ctx.fillStyle = 'rgba(255,60,80,.9)';
    ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-8,-9); ctx.lineTo(-8,9); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

// ── 루프 & 시작/종료 ──
function loop(ts){
  if(!running) return;
  const dt = Math.min(.05, (ts-last)/1000); last = ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
function start(){
  audio();
  reset();
  document.getElementById('startOv').classList.add('hidden');
  document.getElementById('overOv').classList.add('hidden');
  running = true; last = performance.now();
  requestAnimationFrame(loop);
}
function gameOver(byMonster){
  running = false;
  sfx.dead();
  best = Math.max(best, time);
  document.querySelector('#overOv h1').innerHTML = '<span>사망...</span>';
  const cause = byMonster ? '👹 괴물에게 잡혔습니다' : '🍖 굶주림으로 쓰러졌습니다';
  document.getElementById('resultStats').innerHTML =
    `${cause}<br>⏱ 생존 시간: <b>${time.toFixed(1)}초</b><br><span id="bestLine">🏆 최고 기록: ${best.toFixed(1)}초</span>`;
  document.getElementById('overOv').classList.remove('hidden');
}
function victory(){
  running = false;
  draw();                       // 마지막 폭발 장면 렌더
  sfx.win();
  best = Math.max(best, time);
  document.querySelector('#overOv h1').innerHTML = '🎉 <span style="color:#6bffb0">괴물 처치 성공!</span>';
  document.getElementById('resultStats').innerHTML =
    `👹 괴물을 쓰러뜨렸습니다!<br>⏱ 클리어 시간: <b>${time.toFixed(1)}초</b> · 남은 탄약: ${ammo}발<br><span id="bestLine">🏆 최고 기록: ${best.toFixed(1)}초</span>`;
  document.getElementById('overOv').classList.remove('hidden');
}
document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('retryBtn').addEventListener('click', start);
})();
</script>
