<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NIGHT RIDER — 야간 고속도로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#e9f2ff; --dim:#7f93b5; --amber:#ffb84d; --danger:#ff4a3d; --teal:#3fd6c0; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#050a1c}
  body{font-family:'Chakra Petch','Noto Sans KR',system-ui,sans-serif;color:var(--ink);
       -webkit-tap-highlight-color:transparent;user-select:none}
  #app{position:fixed;inset:0}
  canvas{display:block}

  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s ease}
  #hud.on{opacity:1}
  .panel{position:absolute;padding:10px 14px;
    background:linear-gradient(180deg,rgba(8,16,38,.72),rgba(8,16,38,.38));
    border:1px solid rgba(120,160,220,.22);border-radius:2px;backdrop-filter:blur(3px)}
  .label{font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  .val{font-size:26px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
  .val small{font-size:12px;font-weight:400;color:var(--dim);margin-left:3px}

  #stats{top:18px;left:18px;display:flex;gap:24px}
  #stats .val#biome{font-size:20px;color:var(--amber);letter-spacing:.06em}
  #viewbox{top:18px;right:18px;text-align:right}
  #viewbox .val{font-size:18px;letter-spacing:.06em}
  #viewbox .hint{font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:.1em}

  #cluster{position:absolute;left:50%;bottom:14px;width:230px;height:150px;margin-left:-115px;
    transform-origin:50% 92%;transition:transform .08s linear}
  #cluster svg{width:100%;height:auto;overflow:visible}
  #spd{position:absolute;left:0;right:0;top:52px;text-align:center;font-size:52px;font-weight:700;
    line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(63,214,192,.35)}
  #spdUnit{font-size:11px;letter-spacing:.3em;color:var(--dim);text-align:center;margin-top:2px}
  #gear{position:absolute;left:0;right:0;top:112px;text-align:center;font-size:11px;
    letter-spacing:.24em;color:var(--amber)}

  /* 커브 방향 표시 — 계기 좌우의 얇은 셰브런 */
  #curveL,#curveR{position:absolute;bottom:56px;width:26px;height:54px;opacity:0;transition:opacity .12s}
  #curveL{left:50%;margin-left:-176px}
  #curveR{left:50%;margin-left:150px}
  #curveL svg,#curveR svg{width:100%;height:100%}

  #helmets{position:absolute;bottom:24px;left:24px;display:flex;gap:8px}
  .hm{width:15px;height:15px;border-radius:50% 50% 42% 42%;background:var(--teal);
      box-shadow:0 0 10px rgba(63,214,192,.6);transition:.25s}
  .hm.gone{background:rgba(255,255,255,.10);box-shadow:none}

  #toast{position:absolute;left:50%;top:34%;transform:translateX(-50%);font-size:20px;font-weight:700;
    letter-spacing:.05em;color:var(--teal);opacity:0;transition:opacity .18s ease, transform .4s ease;
    text-shadow:0 0 18px rgba(63,214,192,.5);white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-12px)}
  #banner{position:absolute;left:0;right:0;top:22%;text-align:center;opacity:0;
    transition:opacity .5s ease}
  #banner.show{opacity:1}
  #banner .bk{font-size:11px;letter-spacing:.5em;color:var(--dim)}
  #banner .bn{font-size:34px;font-weight:700;letter-spacing:.18em;color:var(--amber);margin-top:6px}

  #flash{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 35%,rgba(255,74,61,.75) 100%);
    opacity:0;transition:opacity .35s ease}
  #flash.hit{opacity:1;transition:opacity .05s}

  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;text-align:center;
    background:radial-gradient(ellipse at 50% 65%,rgba(10,22,58,.55),rgba(3,7,20,.94));z-index:5;padding:24px}
  .screen.hide{display:none}
  .eyebrow{font-size:11px;letter-spacing:.42em;color:var(--amber);text-transform:uppercase}
  h1{font-size:clamp(38px,9vw,74px);font-weight:700;letter-spacing:.02em;line-height:.95}
  h1 em{font-style:normal;display:block;font-size:.3em;letter-spacing:.34em;color:var(--dim);
    margin-top:12px;font-weight:400}
  .route{display:flex;gap:14px;align-items:center;font-size:12px;letter-spacing:.2em;color:var(--dim)}
  .route i{width:6px;height:6px;background:var(--amber);border-radius:50%;display:inline-block}
  .keys{display:grid;grid-template-columns:auto auto;gap:8px 18px;font-size:13px;color:var(--dim);
    align-items:center}
  .keys b{font-weight:600;color:var(--ink);background:rgba(120,160,220,.12);
    border:1px solid rgba(120,160,220,.28);border-radius:3px;padding:3px 9px;font-size:12px}
  .btn{pointer-events:auto;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;
    letter-spacing:.16em;color:#04101f;background:var(--teal);border:0;padding:14px 40px;
    border-radius:2px;transition:.18s}
  .btn:hover{background:#7ff0e0;transform:translateY(-1px)}
  .btn:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  .score-final{font-size:15px;color:var(--dim)}
  .score-final b{color:var(--ink);font-size:30px;font-weight:700;display:block;margin-top:4px}

  #touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:4}
  #touch.on{display:block}
  .tb{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
    background:rgba(12,24,52,.5);border:1px solid rgba(120,160,220,.3);border-radius:50%;
    width:74px;height:74px;font-size:22px;color:var(--ink)}
  .tb:active{background:rgba(63,214,192,.3)}
  #tL{left:18px;bottom:34px} #tR{left:104px;bottom:34px}
  #tGas{right:18px;bottom:96px}
  #tBrk{right:18px;bottom:14px;width:60px;height:60px;font-size:13px}
  #tView{right:104px;bottom:34px;width:60px;height:60px;font-size:12px;letter-spacing:.04em}
  @media (max-width:520px){
    #stats{gap:14px;padding:8px 10px} .val{font-size:19px} #stats .val#biome{font-size:16px}
    #cluster{width:190px;margin-left:-95px} #spd{font-size:42px;top:44px}
    #curveL{margin-left:-150px} #curveR{margin-left:124px}
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="panel" id="stats">
    <div><div class="label">거리</div><div class="val" id="dist">0.0<small>km</small></div></div>
    <div><div class="label">점수</div><div class="val" id="score">0</div></div>
    <div><div class="label">구간</div><div class="val" id="biome">교량</div></div>
  </div>

  <div class="panel" id="viewbox">
    <div class="label">시점</div>
    <div class="val" id="viewname">3인칭</div>
    <div class="hint">V — 시점 전환</div>
  </div>

  <div id="curveL"><svg viewBox="0 0 26 54"><path d="M20 4 L6 27 L20 50" fill="none" stroke="#ffb84d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div id="curveR"><svg viewBox="0 0 26 54"><path d="M6 4 L20 27 L6 50" fill="none" stroke="#ffb84d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

  <div id="cluster">
    <svg viewBox="0 0 200 200">
      <path d="M 34.18 138 A 76 76 0 1 1 165.8 138" fill="none"
            stroke="rgba(120,160,220,.18)" stroke-width="7" stroke-linecap="round"/>
      <path id="arc" d="M 34.18 138 A 76 76 0 1 1 165.8 138" fill="none"
            stroke="#3fd6c0" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="318.3" stroke-dashoffset="318.3"/>
    </svg>
    <div id="spd">0</div>
    <div id="spdUnit">KM / H</div>
    <div id="gear">N</div>
  </div>

  <div id="helmets"><i class="hm"></i><i class="hm"></i><i class="hm"></i></div>
  <div id="toast"></div>
  <div id="banner"><div class="bk">SECTION</div><div class="bn" id="bannerName">교량</div></div>
</div>

<div id="flash"></div>

<div id="touch">
  <div class="tb" id="tL">◀</div><div class="tb" id="tR">▶</div>
  <div class="tb" id="tGas">▲</div><div class="tb" id="tBrk">BRAKE</div>
  <div class="tb" id="tView">시점</div>
</div>

<div class="screen" id="start">
  <div class="eyebrow">Midnight expressway</div>
  <h1>NIGHT RIDER<em>야간 고속도로</em></h1>
  <div class="route"><i></i>교량<i></i>산악<i></i>도시<i></i></div>
  <div class="keys">
    <b>↑ / W</b><span>가속</span>
    <b>↓ / S</b><span>감속·브레이크</span>
    <b>← →</b><span>차선 이동 · 커브 버티기</span>
    <b>V</b><span>3인칭 ↔ 1인칭 전환</span>
    <b>M</b><span>엔진음 켜기/끄기</span>
  </div>
  <button class="btn" id="go">시동 걸기</button>
</div>

<div class="screen hide" id="over">
  <div class="eyebrow">Ride over</div>
  <h1 id="overTitle">주행 종료</h1>
  <div class="score-final">최종 점수<b id="finalScore">0</b></div>
  <div class="score-final">주행 거리<b id="finalDist">0.0 km</b></div>
  <button class="btn" id="again">다시 달리기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   1. 트랙 형상 — 거리 s(m)의 함수로 정의된 곡선
   ============================================================ */
const CURVE = [
  {A:0.26, L:340, P:0.0},
  {A:0.18, L:170, P:1.7},
  {A:0.10, L: 95, P:3.4}
];
function headingAt(s){ let t=0; for(let i=0;i<CURVE.length;i++){const c=CURVE[i]; t+=c.A*Math.sin(s/c.L+c.P);} return t; }
function xAt(s){ let x=0; for(let i=0;i<CURVE.length;i++){const c=CURVE[i]; x+=-c.A*c.L*Math.cos(s/c.L+c.P);} return x; }
function curvAt(s){ let k=0; for(let i=0;i<CURVE.length;i++){const c=CURVE[i]; k+=(c.A/c.L)*Math.cos(s/c.L+c.P);} return k; }

/* ============================================================
   2. 구간(바이옴)
   ============================================================ */
const BLEN = 1500, FADE = 200;
const BIOMES = [
  {name:'교량', ground:-11.0, col:new THREE.Color(0x0e2c2b), fog:new THREE.Color(0x0c1a3c), fogFar:290},
  {name:'산악', ground:-0.55, col:new THREE.Color(0x1a4433), fog:new THREE.Color(0x07131e), fogFar:240},
  {name:'도시', ground:-0.45, col:new THREE.Color(0x2b3038), fog:new THREE.Color(0x17244c), fogFar:270}
];
function biomeMix(s){
  const f = s/BLEN, i = Math.floor(f), fr = f - i;
  const a = ((i%3)+3)%3, b = (((i+1)%3)+3)%3;
  const edge = 1 - FADE/BLEN;
  let t = fr > edge ? (fr-edge)/(FADE/BLEN) : 0;
  t = t*t*(3-2*t);
  return {a:a, b:b, t:t};
}
function biomeIdx(s){ const m = biomeMix(s); return m.t < 0.5 ? m.a : m.b; }
function groundAt(s){ const m = biomeMix(s); return BIOMES[m.a].ground + (BIOMES[m.b].ground - BIOMES[m.a].ground)*m.t; }

/* ============================================================
   3. 렌더러 · 씬
   ============================================================ */
const LANES = [-3.6, 0, 3.6];
const X_MIN = -6.4, X_MAX = 6.4;
const KMH = 3.6, MAX_KMH = 245;
const SEC_N = 84, SEC_STEP = 6, SEC_BACK = 42;   // 도로 리본 단면
const ROAD_L = -32, ROAD_R = 8;                   // 상판 좌우 끝(측면 오프셋)
const VIEW_S = SEC_N*SEC_STEP - SEC_BACK;         // 전방 가시 거리

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a1430);
document.getElementById('app').appendChild(renderer.domElement);
const MAXANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0c1a3c, 45, 290);
const camera = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, 0.1, 1200);
scene.add(camera);
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0x2a3f78, 0x08131f, 0.6));
const moon = new THREE.DirectionalLight(0x9fb6ff, 0.34); moon.position.set(-40,60,-30); scene.add(moon);
const headLamp = new THREE.PointLight(0xfff0cc, 1.5, 46, 2); scene.add(headLamp);

/* ============================================================
   4. 재질 · 텍스처
   ============================================================ */
function mat(hex,o){ return new THREE.MeshLambertMaterial(Object.assign({color:hex},o||{})); }
function basic(hex,o){ return new THREE.MeshBasicMaterial(Object.assign({color:hex},o||{})); }
function box(w,h,d,m){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m); }
function cyl(rt,rb,h,seg,m){ return new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), m); }

function glowTexture(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'), grd=g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(255,255,255,1)'); grd.addColorStop(.2,'rgba(255,255,255,.55)');
  grd.addColorStop(.55,'rgba(255,255,255,.14)'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,128,128);
  const t=new THREE.Texture(c); t.needsUpdate=true; return t;
}
const TEX_GLOW = glowTexture();
function glowSprite(color,size,op){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW,color:color,transparent:true,
    opacity:op===undefined?.85:op,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  s.scale.set(size,size,1); return s;
}
function lightPool(color,w,d,op){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),
    new THREE.MeshBasicMaterial({map:TEX_GLOW,color:color,transparent:true,opacity:op,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  m.rotation.x=-Math.PI/2; m.position.y=0.03; return m;
}

/* 노면 텍스처 : 가로 40m(=ROAD_L..ROAD_R), 세로 12m 타일 */
const TILE = 12;
const TEX_ROAD = (function(){
  const W=512,H=384, c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  const px = x => (x - ROAD_L)/(ROAD_R-ROAD_L)*W;
  const my = m => m/TILE*H;
  g.fillStyle='#2b3038'; g.fillRect(0,0,W,H);                       // 중분대·갓길 콘크리트
  g.fillStyle='#1d3a2c'; g.fillRect(px(-16.4),0,px(-9.0)-px(-16.4),H); // 중앙분리대 녹지
  g.fillStyle='#24252a'; g.fillRect(px(-7.6),0,px(7.6)-px(-7.6),H);  // 주행 차로
  g.fillStyle='#212228'; g.fillRect(px(-30.8),0,px(-17.2)-px(-30.8),H); // 반대편 차로
  function solid(x,w){ g.fillStyle='#dfe6f0'; g.fillRect(px(x-w/2),0,px(w)-px(0),H); }
  function dash(x,w){
    g.fillStyle='#dfe6f0';
    const dw = px(x+w/2)-px(x-w/2);
    g.fillRect(px(x)-dw/2, my(0), dw, my(3.4));                       // 3.4m 선 / 12m 주기
  }
  function line(x,w){ const dw=px(x+w/2)-px(x-w/2); g.fillStyle='#dfe6f0'; g.fillRect(px(x)-dw/2,0,dw,H); }
  line(5.55,0.18); line(-5.55,0.18);            // 주행차로 가장자리
  line(7.35,0.14); line(-7.35,0.14);            // 갓길 바깥선
  dash(1.8,0.16); dash(-1.8,0.16);              // 차선 점선
  line(-17.75,0.16); line(-30.35,0.16);
  dash(-21.55,0.16); dash(-25.45,0.16);
  const t=new THREE.Texture(c); t.needsUpdate=true;
  t.wrapS=THREE.ClampToEdgeWrapping; t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=MAXANISO; return t;
})();

/* 건물 창문 텍스처 */
function windowTexture(seed){
  const W=64,H=128,c=document.createElement('canvas'); c.width=W;c.height=H;
  const g=c.getContext('2d'); g.fillStyle='#121722'; g.fillRect(0,0,W,H);
  let r=seed; const rnd=()=> (r=(r*9301+49297)%233280)/233280;
  const cols=6, rows=16;
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    if(rnd()<0.42){
      const warm = rnd();
      g.fillStyle = warm<0.6?'#ffd79a':(warm<0.85?'#cfe6ff':'#9fe3c8');
      g.globalAlpha = 0.55+rnd()*0.45;
      g.fillRect(x*(W/cols)+2, y*(H/rows)+2, W/cols-4, H/rows-4);
      g.globalAlpha = 1;
    }
  }
  const t=new THREE.Texture(c); t.needsUpdate=true;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
const WIN_TEX = [windowTexture(11), windowTexture(77), windowTexture(203)];

/* ============================================================
   5. 리본 지오메트리 (도로 · 지형 · 가드레일)
   ============================================================ */
function makeRibbon(rows, material, withUV, withColor){
  const g = new THREE.BufferGeometry();
  const n = SEC_N*rows;
  const pos = new Float32Array(n*3);
  const nrm = new Float32Array(n*3);
  for(let i=0;i<n;i++){ nrm[i*3]=0; nrm[i*3+1]=1; nrm[i*3+2]=0; }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.BufferAttribute(nrm,3));
  if(withUV) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n*2),2));
  if(withColor) g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n*3),3));
  const idx=[];
  for(let i=0;i<SEC_N-1;i++) for(let j=0;j<rows-1;j++){
    const a=i*rows+j, b=(i+1)*rows+j, c=(i+1)*rows+j+1, d=i*rows+j+1;
    idx.push(a,c,b, a,d,c);
  }
  g.setIndex(idx);
  const m = new THREE.Mesh(g, material);
  m.frustumCulled = false;
  scene.add(m);
  return m;
}

const roadMesh   = makeRibbon(2, new THREE.MeshLambertMaterial({map:TEX_ROAD}), true, false);
const underMesh  = makeRibbon(2, basic(0x141821), false, false);
const terrainR   = makeRibbon(2, new THREE.MeshLambertMaterial({vertexColors:true}), false, true);
const terrainL   = makeRibbon(2, new THREE.MeshLambertMaterial({vertexColors:true}), false, true);
const skirtR = makeRibbon(2, basic(0x2a3038,{side:THREE.DoubleSide}), false, false);
const skirtL = makeRibbon(2, basic(0x2a3038,{side:THREE.DoubleSide}), false, false);
const RAIL_X = [8.0, -9.0, -16.4, -31.4];
const railMeshes = RAIL_X.map(()=> makeRibbon(2, basic(0x79838f, {side:THREE.DoubleSide}), false, false));

/* 단면 캐시 */
const SEC = [];
for(let i=0;i<SEC_N;i++) SEC.push({s:0,th:0,x:0,ct:1,st:0});

let s0=0, th0=0, cos0=1, sin0=0, X0=0, Z0=0;

function toLocal(s, sx, sth, lat, o){
  const X = sx + lat*Math.cos(sth);
  const Z = -s + lat*Math.sin(sth);
  const dx = X - X0, dz = Z - Z0;
  o.x = dx*cos0 + dz*sin0;
  o.z = -dx*sin0 + dz*cos0;
  o.yaw = -(sth - th0);
  return o;
}
const _o = {x:0,z:0,yaw:0};

/* ============================================================
   6. 프롭 풀 (가로등 · 표지판 · 교각 · 나무 · 건물 · 방음벽)
   ============================================================ */
const props = [];   // {obj, s, lat, span, biome(-1=항상), extra}
function addProp(obj, s, lat, span, biome, data){
  obj.frustumCulled = false;
  scene.add(obj);

function ridge(width, depth, height, color, seed){

  const hs=[]; for(let i=0;i<=pts;i++) hs.push(height*(0.42+rand()*0.58));

    const x0=-width/2+width*i/pts, x1=-width/2+width*(i+1)/pts;
    v.push(x0,0,0, x1,0,0, x0,hs[i],0);
    v.push(x1,0,0, x1,hs[i+1],0, x0,hs[i],0);
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(v,3));
  const m=new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:color, fog:false}));
  m.position.z=depth; m.frustumCulled=false; return m;
}

let actx=null, oscA=null, oscB=null, engGain=null, filt=null;
function initAudio(){
  if(actx) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    engGain=actx.createGain(); engGain.gain.value=0;
    filt=actx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=900;
    oscA=actx.createOscillator(); oscA.type='sawtooth'; oscA.frequency.value=60;
    oscB=actx.createOscillator(); oscB.type='square'; oscB.frequency.value=30;
    const gB=actx.createGain(); gB.gain.value=0.35;
    oscA.connect(filt); oscB.connect(gB); gB.connect(filt);
    filt.connect(engGain); engGain.connect(actx.destination);
    oscA.start(); oscB.start();
  }catch(e){ actx=null; }
}
function setEngineVolume(){ if(engGain) engGain.gain.value=(audioOn&&state==='run')?0.05:0; }
function updateAudio(){
  if(!actx||!oscA) return;
  const r=BIKE.speed/(MAX_KMH/KMH);
  const f=52+r*230+BIKE.throttle*22;
  oscA.frequency.value=f; oscB.frequency.value=f/2;
  filt.frequency.value=500+r*2200;
  setEngineVolume();
}

/* ============================================================
   10. 프레임 갱신
   ============================================================ */
const clock=new THREE.Clock();
let camPos=new THREE.Vector3(0,2.4,7), camLook=new THREE.Vector3(0,1.2,-10), camRoll=0;
const fogCol=new THREE.Color(0x0c1a3c), tmpColA=new THREE.Color(), tmpColB=new THREE.Color();

function updateRibbons(){
  /* 단면 캐시 */
  for(let i=0;i<SEC_N;i++){
    const s=s0 - SEC_BACK + i*SEC_STEP;
    const sc=SEC[i];
    sc.s=s; sc.th=headingAt(s); sc.x=xAt(s);
    sc.ct=Math.cos(sc.th); sc.st=Math.sin(sc.th);
    sc.gy=groundAt(s);
    const m=biomeMix(s);
    tmpColA.copy(BIOMES[m.a].col); tmpColB.copy(BIOMES[m.b].col);
    sc.cr=tmpColA.r+(tmpColB.r-tmpColA.r)*m.t;
    sc.cg=tmpColA.g+(tmpColB.g-tmpColA.g)*m.t;
    sc.cb=tmpColA.b+(tmpColB.b-tmpColA.b)*m.t;
  }

  function fill(mesh, lats, ys, colored){
    const pos=mesh.geometry.attributes.position.array;
    const uv = mesh.geometry.attributes.uv ? mesh.geometry.attributes.uv.array : null;
    const col= colored && mesh.geometry.attributes.color ? mesh.geometry.attributes.color.array : null;
    const rows=lats.length;
    for(let i=0;i<SEC_N;i++){
      const sc=SEC[i];
      for(let j=0;j<rows;j++){
        toLocal(sc.s, sc.x, sc.th, lats[j], _o);
        const k=(i*rows+j)*3;
        pos[k]=_o.x;
        pos[k+1]= (typeof ys[j]==='function') ? ys[j](sc) : ys[j];
        pos[k+2]=_o.z;
        if(uv){ const u=(i*rows+j)*2; uv[u]=j; uv[u+1]=sc.s/TILE; }
        if(col){ col[k]=sc.cr; col[k+1]=sc.cg; col[k+2]=sc.cb; }
      }
    }
    mesh.geometry.attributes.position.needsUpdate=true;
    if(uv) mesh.geometry.attributes.uv.needsUpdate=true;
    if(col) mesh.geometry.attributes.color.needsUpdate=true;
  }

  fill(roadMesh,  [ROAD_L, ROAD_R], [0,0], false);
  fill(underMesh, [ROAD_L-0.6, ROAD_R+0.6], [-1.5,-1.5], false);
  fill(terrainR,  [ROAD_R+0.05, ROAD_R+92], [function(sc){return sc.gy;}, function(sc){return sc.gy-2;}], true);
  fill(terrainL,  [ROAD_L-92, ROAD_L-0.05], [function(sc){return sc.gy-2;}, function(sc){return sc.gy;}], true);
  fill(skirtR, [ROAD_R+0.55, ROAD_R+0.55], [0.05,-1.7], false);
  fill(skirtL, [ROAD_L-0.55, ROAD_L-0.55], [0.05,-1.7], false);
  for(let r=0;r<RAIL_X.length;r++) fill(railMeshes[r], [RAIL_X[r], RAIL_X[r]], [0.55,0.95], false);
}

function update(dt){
  const running = state==='run';

  const gas   = running && (keys.ArrowUp||keys.KeyW||touchState.gas);
  const brk   = running && (keys.ArrowDown||keys.KeyS||touchState.brk);
  const left  = running && (keys.ArrowLeft||keys.KeyA||touchState.L);
  const right = running && (keys.ArrowRight||keys.KeyD||touchState.R);

  BIKE.throttle += ((gas?1:0)-BIKE.throttle)*Math.min(1,dt*6);
  BIKE.brake    += ((brk?1:0)-BIKE.brake)*Math.min(1,dt*9);

  const vMax=MAX_KMH/KMH;
  if(running){
    const accel=9.5*(1-BIKE.speed/vMax*0.82);
    BIKE.speed += BIKE.throttle*accel*dt;
    BIKE.speed -= BIKE.brake*14*dt;
    BIKE.speed -= (0.35+BIKE.speed*BIKE.speed*0.00055)*dt;
    if(BIKE.crashT>0){ BIKE.crashT-=dt; BIKE.speed*=(1-dt*1.6); }
    BIKE.speed=Math.max(0,Math.min(vMax,BIKE.speed));
  } else BIKE.speed*=(1-dt*0.8);
  if(BIKE.invT>0) BIKE.invT-=dt;

  /* 전진 */
  const move=BIKE.speed*dt;
  s0 += move;
  distance += move/1000;

  /* 커브 — 원심력으로 바깥쪽으로 밀림 */
  const k = curvAt(s0);
  const steerTarget=(right?1:0)-(left?1:0);
  BIKE.steer += (steerTarget-BIKE.steer)*Math.min(1,dt*8);
  const agility=4.4*Math.min(1,0.35+BIKE.speed/26);
  BIKE.x += BIKE.steer*agility*dt;
  BIKE.x -= k*BIKE.speed*BIKE.speed*0.26*dt;
  BIKE.x = Math.max(X_MIN, Math.min(X_MAX, BIKE.x));

  const leanCurve = Math.max(-0.28, Math.min(0.28, -k*BIKE.speed*BIKE.speed*0.02));
  const leanTarget = -BIKE.steer*0.42*Math.min(1,0.4+BIKE.speed/30) + leanCurve;
  BIKE.lean += (leanTarget-BIKE.lean)*Math.min(1,dt*7);

  /* 좌표계 기준 갱신 */
  th0=headingAt(s0); cos0=Math.cos(th0); sin0=Math.sin(th0);
  X0=xAt(s0); Z0=-s0;

  bike.position.set(BIKE.x, 0, 0);
  chassis.rotation.z=BIKE.lean;
  chassis.rotation.y=BIKE.steer*0.06;
  chassis.position.y=Math.sin(performance.now()*0.03)*0.008*Math.min(1,BIKE.speed/vMax);
  const spin=BIKE.speed*dt/0.35; wF.rotation.x-=spin; wR.rotation.x-=spin;
  bike.visible = BIKE.invT>0 ? (Math.floor(performance.now()/70)%2===0) : true;

  /* 리본 */
  updateRibbons();

  /* 프롭 */
  for(let i=0;i<props.length;i++){
    const p=props[i];
    while(p.s < s0-60) p.s += p.span;
    while(p.s > s0+p.span-60) p.s -= p.span;
    const rel = p.s - s0;
    if(rel > VIEW_S+40){ p.obj.visible=false; continue; }
    const bi = biomeIdx(p.s);
    let vis = (p.biome<0) || (p.biome===bi);
    if(vis && p.biome<0 && p.d.lampIdx!==undefined && bi===1) vis = (p.d.lampIdx%2===0);
    p.obj.visible = vis;
    if(!vis) continue;
    const th=headingAt(p.s), sx=xAt(p.s);
    toLocal(p.s, sx, th, p.lat, _o);
    p.obj.position.set(_o.x, (p.biome===1||p.biome===2) ? groundAt(p.s) : 0, _o.z);
    p.obj.rotation.y = _o.yaw + (p.d.flip?Math.PI:0);
  }

  /* 교통 */
  for(let i=0;i<traffic.length;i++){
    const v=traffic[i], u=v.userData;
    u.s += (u.kmh/KMH)*dt;
    u.laneT -= dt;
    if(u.laneT<=0){
      u.laneT=6+Math.random()*10;
      if(Math.random()<0.45){
        let cur=0, best=1e9;
        for(let n=0;n<3;n++){ const d=Math.abs(LANES[n]-u.lat); if(d<best){best=d;cur=n;} }
        const nx=Math.max(0,Math.min(2,cur+(Math.random()<0.5?-1:1)));
        u.target=LANES[nx];
      }
    }
    if(u.target!==undefined){
      const d=u.target-u.lat;
      u.lat += Math.sign(d)*Math.min(Math.abs(d), 2.2*dt);
      if(Math.abs(d)<0.02){ u.lat=u.target; u.target=undefined; }
    }
    const rel=u.s-s0;
    if(rel < -45 || rel > VIEW_S+130){ respawnTraffic(v,false); continue; }
    const th=headingAt(u.s), sx=xAt(u.s);
    toLocal(u.s, sx, th, u.lat, _o);
    v.position.set(_o.x, 0, _o.z);
    v.rotation.y=_o.yaw;

    if(running && BIKE.invT<=0){
      const dz=Math.abs(rel), dx=Math.abs(u.lat-BIKE.x);
      if(dz < u.len/2+1.0 && dx < u.wid/2+0.42) crash();
      else if(!u.nearMiss && dz < u.len/2+1.4 && dx < u.wid/2+1.1){
        u.nearMiss=true;
        const bonus=120+Math.floor(BIKE.speed*KMH);
        score+=bonus; toast('아슬아슬 추월  +'+bonus);
      }
    }
    if(!u.passed && rel < -3){ u.passed=true; score+=60; }
  }

  for(let i=0;i<oncoming.length;i++){
    const v=oncoming[i], u=v.userData;
    u.s -= (u.kmh/KMH)*dt;
    const rel=u.s-s0;
    if(rel < -45 || rel > VIEW_S+120){ respawnOncoming(v,false); continue; }
    const th=headingAt(u.s), sx=xAt(u.s);
    toLocal(u.s, sx, th, u.lat, _o);
    v.position.set(_o.x, 0, _o.z);
    v.rotation.y=_o.yaw+Math.PI;
  }

  if(running){
    score += move*(0.9+BIKE.speed/vMax*2.6);
    if(BIKE.speed*KMH>200) score += dt*40;
  }

  /* 안개 · 구간 */
  const mix=biomeMix(s0);
  tmpColA.copy(BIOMES[mix.a].fog); tmpColB.copy(BIOMES[mix.b].fog);
  fogCol.copy(tmpColA).lerp(tmpColB, mix.t);
  scene.fog.color.copy(fogCol);
  scene.fog.far = BIOMES[mix.a].fogFar + (BIOMES[mix.b].fogFar-BIOMES[mix.a].fogFar)*mix.t;
  renderer.setClearColor(fogCol);

  const bi=biomeIdx(s0);
  if(bi!==lastBiome){
    lastBiome=bi;
    el.biome.textContent=BIOMES[bi].name;
    el.bannerName.textContent=BIOMES[bi].name+' 구간';
    el.banner.classList.add('show'); bannerT=2.0;
  }
  if(bannerT>0){ bannerT-=dt; if(bannerT<=0) el.banner.classList.remove('show'); }

  /* 카메라 — 커브 안쪽을 미리 본다 */
  const aheadS = s0 + 46;
  toLocal(aheadS, xAt(aheadS), headingAt(aheadS), 0, _o);
  const lookX = _o.x;

  let tPos,tLook,tRoll;
  const shake=Math.pow(BIKE.speed/vMax,2)*0.035+(BIKE.crashT>0?BIKE.crashT*0.4:0);
  if(firstPerson){
    tPos=new THREE.Vector3(BIKE.x+BIKE.lean*0.12, 1.62, 0.28);
    tLook=new THREE.Vector3(lookX*0.55+BIKE.x*0.45+BIKE.steer*1.6, 1.35, -22);
    tRoll=BIKE.lean*0.85;
    camera.fov=68+(BIKE.speed/vMax)*12;
  }else{
    tPos=new THREE.Vector3(BIKE.x*0.82-BIKE.lean*0.8, 2.35, 5.6);
    tLook=new THREE.Vector3(lookX*0.35+BIKE.x*0.6+BIKE.steer*1.0, 1.15, -16);
    tRoll=BIKE.lean*0.22;
    camera.fov=64+(BIKE.speed/vMax)*10;
  }
  camera.updateProjectionMatrix();
  const kk=Math.min(1,dt*(firstPerson?12:7));
  camPos.lerp(tPos,kk); camLook.lerp(tLook,kk); camRoll+=(tRoll-camRoll)*kk;
  camera.position.copy(camPos);
  camera.position.x+=(Math.random()-0.5)*shake;
  camera.position.y+=(Math.random()-0.5)*shake;
  camera.lookAt(camLook);
  camera.rotation.z+=camRoll;

  headLamp.position.set(BIKE.x,1.2,-7);
  beam.position.z=-14-BIKE.speed*0.45;

  /* 원경 능선을 카메라 앞쪽에 고정 */
  for(let i=0;i<ridges.length;i++){
    ridges[i].position.x = camera.position.x*0.15;
  }

  /* HUD */
  const kmh=BIKE.speed*KMH;
  el.spd.textContent=Math.round(kmh);
  el.dist.innerHTML=distance.toFixed(1)+'<small>km</small>';
  el.score.textContent=Math.floor(score).toLocaleString('ko-KR');
  const ratio=Math.min(1,kmh/MAX_KMH);
  el.arc.setAttribute('stroke-dashoffset', ARC_LEN*(1-ratio));
  el.arc.setAttribute('stroke', kmh>190?'#ff6a4a':(kmh>130?'#ffb84d':'#3fd6c0'));
  const gearN = kmh<1?'N':String(Math.min(6,1+Math.floor(kmh/42)));
  el.gear.textContent = gearN==='N'?'N':gearN+'단';
  el.cluster.style.transform='rotate('+(BIKE.lean*14).toFixed(2)+'deg)';

  const kAhead=curvAt(s0+70);
  el.curveR.style.opacity = kAhead >  0.0011 ? Math.min(1,(kAhead-0.0011)*700) : 0;
  el.curveL.style.opacity = kAhead < -0.0011 ? Math.min(1,(-kAhead-0.0011)*700) : 0;

  if(toastT>0){ toastT-=dt; if(toastT<=0) el.toast.classList.remove('show'); }
  updateAudio();
}

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05, clock.getDelta());
  update(dt);
  renderer.render(scene,camera);
}
document.getElementById('viewname').textContent='3인칭';
traffic.forEach(function(v){ respawnTraffic(v,true); });
oncoming.forEach(function(v){ respawnOncoming(v,true); });
loop();

})();
</script>
