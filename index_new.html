<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#090615">

    <title>물티슈 GAME ARCADE</title>

    <style>
        :root {
            --sidebar-width: 310px;
            --toolbar-height: 64px;

            --bg-main: #070510;
            --bg-panel: rgba(18, 13, 37, 0.88);
            --bg-card: rgba(32, 23, 62, 0.72);
            --bg-card-hover: rgba(52, 35, 91, 0.9);

            --border: rgba(176, 120, 255, 0.22);
            --border-strong: rgba(59, 238, 255, 0.65);

            --text-main: #ffffff;
            --text-sub: #aaa4bf;
            --text-dark: #090615;

            --cyan: #3beeff;
            --purple: #a855f7;
            --pink: #ff4fd8;
            --green: #62ff9b;
            --yellow: #ffe66d;

            --shadow-cyan:
                0 0 8px rgba(59, 238, 255, 0.65),
                0 0 22px rgba(59, 238, 255, 0.25);

            --shadow-purple:
                0 0 12px rgba(168, 85, 247, 0.6),
                0 0 30px rgba(168, 85, 247, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            color: var(--text-main);
            font-family:
                "Pretendard",
                "Noto Sans KR",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(168, 85, 247, 0.18),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(59, 238, 255, 0.13),
                    transparent 32%
                ),
                linear-gradient(
                    145deg,
                    #05030b 0%,
                    #0c0718 48%,
                    #05030b 100%
                );
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            position: relative;
            display: flex;
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }

        /* 배경 장식 */

        .background-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.17;

            background-image:
                linear-gradient(
                    rgba(59, 238, 255, 0.15) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(168, 85, 247, 0.15) 1px,
                    transparent 1px
                );

            background-size: 42px 42px;
            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 18%,
                    black 82%,
                    transparent
                );
        }

        .background-glow {
            position: fixed;
            width: 380px;
            height: 380px;
            z-index: -1;
            pointer-events: none;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.15;
        }

        .background-glow.one {
            top: -160px;
            left: 12%;
            background: var(--purple);
        }

        .background-glow.two {
            right: -180px;
            bottom: -160px;
            background: var(--cyan);
        }

        /* 사이드바 */

        .sidebar {
            position: relative;
            z-index: 30;

            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            height: 100vh;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    180deg,
                    rgba(17, 11, 35, 0.97),
                    rgba(8, 6, 19, 0.97)
                );

            border-right: 1px solid var(--border);
            box-shadow:
                8px 0 40px rgba(0, 0, 0, 0.28),
                1px 0 0 rgba(59, 238, 255, 0.05);

            backdrop-filter: blur(18px);
            transition:
                width 0.25s ease,
                min-width 0.25s ease,
                transform 0.25s ease;
        }

        .sidebar-header {
            padding:
                calc(20px + env(safe-area-inset-top))
                18px
                16px;

            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 0;
        }

        .brand-logo {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;

            display: grid;
            place-items: center;

            border: 1px solid rgba(59, 238, 255, 0.6);
            border-radius: 16px;

            color: var(--text-dark);
            font-size: 26px;
            font-weight: 1000;

            background:
                linear-gradient(
                    135deg,
                    var(--cyan),
                    #85f7ff 45%,
                    var(--purple)
                );

            box-shadow:
                var(--shadow-cyan),
                inset 0 0 12px rgba(255, 255, 255, 0.32);

            transform: rotate(-3deg);
        }

        .brand-logo::after {
            content: "";
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(255, 255, 255, 0.34);
            border-radius: 12px;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-title {
            margin: 0;

            color: #ffffff;
            font-size: 19px;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: 0.8px;

            text-shadow:
                0 0 11px rgba(59, 238, 255, 0.35);
        }

        .brand-title strong {
            color: var(--cyan);
        }

        .brand-subtitle {
            margin-top: 5px;

            color: var(--text-sub);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.8px;
        }

        .sidebar-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 16px;
        }

        .game-count {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 7px 10px;

            border: 1px solid rgba(168, 85, 247, 0.28);
            border-radius: 999px;

            color: #d9ccff;
            font-size: 12px;
            font-weight: 800;

            background: rgba(168, 85, 247, 0.1);
        }

        .game-count-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 9px var(--green);
        }

        .github-link {
            color: var(--text-sub);
            font-size: 12px;
            text-decoration: none;
            transition: color 0.18s ease;
        }

        .github-link:hover {
            color: var(--cyan);
        }

        /* 검색 */

        .search-area {
            padding: 14px 14px 8px;
        }

        .search-box {
            position: relative;
        }

        .search-icon {
            position: absolute;
            top: 50%;
            left: 13px;
            transform: translateY(-50%);

            color: #77708e;
            font-size: 16px;
            pointer-events: none;
        }

        #gameSearch {
            width: 100%;
            height: 43px;
            padding: 0 38px 0 39px;

            border: 1px solid rgba(168, 85, 247, 0.22);
            border-radius: 13px;
            outline: none;

            color: #ffffff;
            font-size: 13px;

            background: rgba(255, 255, 255, 0.045);

            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease,
                background 0.18s ease;
        }

        #gameSearch::placeholder {
            color: #736d86;
        }

        #gameSearch:focus {
            border-color: rgba(59, 238, 255, 0.58);
            background: rgba(255, 255, 255, 0.065);
            box-shadow: 0 0 0 3px rgba(59, 238, 255, 0.08);
        }

        .clear-search {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);

            width: 29px;
            height: 29px;
            padding: 0;
            display: none;
            place-items: center;

            border: 0;
            border-radius: 9px;

            color: #b8b1ca;
            font-size: 17px;
            background: transparent;
            cursor: pointer;
        }

        .clear-search.visible {
            display: grid;
        }

        .clear-search:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
        }

        /* 게임 목록 */

        .list-label {
            padding: 10px 18px 7px;

            color: #77708e;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.8px;
        }

        #gameList {
            flex: 1;
            min-height: 0;
            margin: 0;
            padding: 4px 12px 18px;

            overflow-x: hidden;
            overflow-y: auto;

            list-style: none;
            scrollbar-width: thin;
            scrollbar-color:
                rgba(168, 85, 247, 0.45)
                transparent;
        }

        #gameList::-webkit-scrollbar {
            width: 6px;
        }

        #gameList::-webkit-scrollbar-track {
            background: transparent;
        }

        #gameList::-webkit-scrollbar-thumb {
            border-radius: 10px;
            background: rgba(168, 85, 247, 0.4);
        }

        .game-item {
            margin: 7px 0;
        }

        .game-button {
            position: relative;
            width: 100%;
            min-height: 61px;
            padding: 8px 12px;

            display: flex;
            align-items: center;
            gap: 11px;

            overflow: hidden;

            border: 1px solid transparent;
            border-radius: 15px;

            color: #d8d2e5;
            text-align: left;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.045),
                    rgba(255, 255, 255, 0.018)
                );

            cursor: pointer;

            transition:
                transform 0.17s ease,
                border-color 0.17s ease,
                background 0.17s ease,
                box-shadow 0.17s ease;
        }

        .game-button::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0;

            background:
                linear-gradient(
                    110deg,
                    transparent 25%,
                    rgba(255, 255, 255, 0.07) 48%,
                    transparent 70%
                );

            transform: translateX(-100%);
            transition:
                transform 0.45s ease,
                opacity 0.2s ease;
        }

        .game-button:hover {
            transform: translateX(3px);
            border-color: rgba(168, 85, 247, 0.35);
            background: var(--bg-card-hover);
        }

        .game-button:hover::before {
            opacity: 1;
            transform: translateX(100%);
        }

        .game-button.active {
            color: #ffffff;
            border-color: rgba(59, 238, 255, 0.58);

            background:
                linear-gradient(
                    135deg,
                    rgba(59, 238, 255, 0.16),
                    rgba(168, 85, 247, 0.18)
                );

            box-shadow:
                0 0 0 1px rgba(59, 238, 255, 0.05),
                0 8px 25px rgba(0, 0, 0, 0.25),
                0 0 20px rgba(59, 238, 255, 0.08);
        }

        .game-button.active::after {
            content: "";
            position: absolute;
            top: 10px;
            bottom: 10px;
            left: 0;

            width: 3px;
            border-radius: 0 4px 4px 0;

            background: var(--cyan);
            box-shadow: 0 0 12px var(--cyan);
        }

        .game-number {
            position: relative;
            z-index: 1;

            width: 38px;
            height: 38px;
            flex-shrink: 0;

            display: grid;
            place-items: center;

            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;

            color: #c8afff;
            font-size: 12px;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    rgba(168, 85, 247, 0.15),
                    rgba(59, 238, 255, 0.06)
                );
        }

        .game-button.active .game-number {
            color: #061013;
            border-color: transparent;
            background:
                linear-gradient(
                    135deg,
                    var(--cyan),
                    #c5fbff
                );
            box-shadow: var(--shadow-cyan);
        }

        .game-info {
            position: relative;
            z-index: 1;
            min-width: 0;
            flex: 1;
        }

        .game-name {
            display: block;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            font-size: 14px;
            font-weight: 800;
            line-height: 1.3;
        }

        .game-type {
            display: block;
            margin-top: 4px;

            color: #7f788f;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.7px;
        }

        .game-button.active .game-type {
            color: #a9eaf0;
        }

        .play-symbol {
            position: relative;
            z-index: 1;
            flex-shrink: 0;

            color: #655d78;
            font-size: 16px;

            transition:
                color 0.18s ease,
                transform 0.18s ease;
        }

        .game-button:hover .play-symbol,
        .game-button.active .play-symbol {
            color: var(--cyan);
            transform: translateX(2px);
        }

        .status {
            padding: 28px 15px;

            color: var(--text-sub);
            text-align: center;
            font-size: 13px;
            line-height: 1.7;
        }

        .status-icon {
            display: block;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .sidebar-footer {
            padding: 12px 16px calc(13px + env(safe-area-inset-bottom));

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-top: 1px solid var(--border);

            color: #655e76;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.7px;
        }

        .online-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .online-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }

        /* 메인 영역 */

        .content {
            position: relative;
            min-width: 0;
            flex: 1;
            height: 100vh;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            background: rgba(5, 3, 12, 0.42);
        }

        .toolbar {
            position: relative;
            z-index: 20;

            height: var(--toolbar-height);
            min-height: var(--toolbar-height);
            padding: 0 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            border-bottom: 1px solid var(--border);

            background:
                linear-gradient(
                    90deg,
                    rgba(14, 9, 28, 0.94),
                    rgba(20, 12, 42, 0.9)
                );

            backdrop-filter: blur(18px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        }

        .toolbar-left {
            min-width: 0;
            flex: 1;

            display: flex;
            align-items: center;
            gap: 11px;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            padding: 0;

            display: grid;
            place-items: center;

            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 12px;

            color: #cfc8df;
            font-size: 17px;

            background: rgba(255, 255, 255, 0.045);
            cursor: pointer;

            transition:
                color 0.18s ease,
                border-color 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease,
                transform 0.18s ease;
        }

        .icon-button:hover {
            color: var(--cyan);
            border-color: rgba(59, 238, 255, 0.5);
            background: rgba(59, 238, 255, 0.07);
            box-shadow: 0 0 16px rgba(59, 238, 255, 0.1);
            transform: translateY(-1px);
        }

        .mobile-menu-button {
            display: none;
        }

        .title-area {
            min-width: 0;
        }

        .title-label {
            display: block;
            margin-bottom: 3px;

            color: var(--cyan);
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.8px;
        }

        #currentTitle {
            display: block;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            color: #ffffff;
            font-size: 15px;
            font-weight: 900;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .action-button {
            height: 40px;
            padding: 0 13px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 12px;

            color: #d8d1e8;
            font-size: 12px;
            font-weight: 800;

            background: rgba(255, 255, 255, 0.045);
            cursor: pointer;

            transition:
                color 0.18s ease,
                border-color 0.18s ease,
                background 0.18s ease,
                transform 0.18s ease;
        }

        .action-button:hover {
            color: #ffffff;
            border-color: rgba(168, 85, 247, 0.55);
            background: rgba(168, 85, 247, 0.13);
            transform: translateY(-1px);
        }

        .action-button.primary {
            color: #061216;
            border-color: transparent;

            background:
                linear-gradient(
                    135deg,
                    var(--cyan),
                    #a8f8ff
                );

            box-shadow: 0 0 16px rgba(59, 238, 255, 0.18);
        }

        .action-button.primary:hover {
            color: #061216;
            border-color: transparent;
            background:
                linear-gradient(
                    135deg,
                    #75f3ff,
                    #d1fcff
                );
        }

        .button-icon {
            font-size: 15px;
            line-height: 1;
        }

        /* 게임 프레임 */

        .game-stage {
            position: relative;
            min-height: 0;
            flex: 1;
            padding: 12px;

            display: flex;
            overflow: hidden;
        }

        .frame-shell {
            position: relative;
            min-width: 0;
            min-height: 0;
            flex: 1;

            overflow: hidden;

            border: 1px solid rgba(168, 85, 247, 0.24);
            border-radius: 18px;

            background: #09070f;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.42),
                0 0 0 1px rgba(59, 238, 255, 0.03),
                0 0 40px rgba(168, 85, 247, 0.06);
        }

        .frame-shell::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            z-index: 4;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--cyan),
                    transparent
                );

            box-shadow: 0 0 13px var(--cyan);
            pointer-events: none;
        }

        #gameFrame {
            position: relative;
            z-index: 1;

            display: block;
            width: 100%;
            height: 100%;

            border: 0;
            background: #ffffff;
        }

        /* 최초 안내 */

        .welcome-screen {
            position: absolute;
            inset: 0;
            z-index: 3;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;

            text-align: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(168, 85, 247, 0.16),
                    transparent 45%
                ),
                linear-gradient(
                    145deg,
                    #090614,
                    #05030b
                );

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .welcome-content {
            max-width: 520px;
        }

        .welcome-icon {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 23px;

            display: grid;
            place-items: center;

            border: 1px solid rgba(59, 238, 255, 0.5);
            border-radius: 28px;

            color: #061216;
            font-size: 42px;

            background:
                linear-gradient(
                    135deg,
                    var(--cyan),
                    var(--purple)
                );

            box-shadow:
                0 0 22px rgba(59, 238, 255, 0.3),
                0 0 45px rgba(168, 85, 247, 0.2);

            animation: welcomeFloat 2.8s ease-in-out infinite;
        }

        @keyframes welcomeFloat {
            0%,
            100% {
                transform: translateY(0) rotate(-2deg);
            }

            50% {
                transform: translateY(-8px) rotate(2deg);
            }
        }

        .welcome-title {
            margin: 0;

            font-size: clamp(25px, 4vw, 43px);
            font-weight: 1000;
            line-height: 1.12;
            letter-spacing: -1.5px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    var(--cyan),
                    #d8b4fe
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow: 0 0 30px rgba(59, 238, 255, 0.13);
        }

        .welcome-description {
            margin: 15px 0 0;

            color: #9992ab;
            font-size: 14px;
            line-height: 1.75;
        }

        .welcome-hint {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            padding: 10px 15px;

            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 999px;

            color: #d8c6ff;
            font-size: 12px;
            font-weight: 800;

            background: rgba(168, 85, 247, 0.09);
        }

        /* 로딩 */

        .loading-overlay {
            position: absolute;
            inset: 0;
            z-index: 6;

            display: flex;
            align-items: center;
            justify-content: center;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            background: rgba(6, 4, 13, 0.88);
            backdrop-filter: blur(8px);

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }

        .loading-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .loader {
            text-align: center;
        }

        .loader-ring {
            position: relative;
            width: 62px;
            height: 62px;
            margin: 0 auto 16px;

            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--cyan);
            border-right-color: var(--purple);
            border-radius: 50%;

            box-shadow:
                0 0 18px rgba(59, 238, 255, 0.15);

            animation: spin 0.8s linear infinite;
        }

        .loader-ring::after {
            content: "";
            position: absolute;
            inset: 8px;

            border: 2px solid transparent;
            border-bottom-color: var(--pink);
            border-radius: 50%;

            animation: spinReverse 1.15s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes spinReverse {
            to {
                transform: rotate(-360deg);
            }
        }

        .loader-text {
            color: #ffffff;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1.2px;
        }

        .loader-subtext {
            margin-top: 5px;
            color: #81798f;
            font-size: 10px;
        }

        /* 사이드바 접힘 */

        body.sidebar-collapsed .sidebar {
            width: 0;
            min-width: 0;
            overflow: hidden;
            border-right-color: transparent;
        }

        body.sidebar-collapsed .desktop-collapse-button {
            transform: rotate(180deg);
        }

        /* 모바일 오버레이 */

        .sidebar-overlay {
            display: none;
        }

        /* 전체화면 */

        .frame-shell:fullscreen {
            width: 100vw;
            height: 100vh;
            border: 0;
            border-radius: 0;
            background: #000000;
        }

        .frame-shell:fullscreen #gameFrame {
            width: 100%;
            height: 100%;
        }

        /* 반응형 */

        @media (max-width: 850px) {
            :root {
                --toolbar-height: 56px;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                z-index: 1000;

                width: min(310px, 86vw);
                min-width: min(310px, 86vw);

                transform: translateX(-105%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            body.sidebar-collapsed .sidebar {
                width: min(310px, 86vw);
                min-width: min(310px, 86vw);
            }

            .sidebar-overlay {
                position: fixed;
                inset: 0;
                z-index: 999;

                display: block;
                visibility: hidden;
                opacity: 0;

                background: rgba(2, 1, 8, 0.72);
                backdrop-filter: blur(3px);

                transition:
                    opacity 0.25s ease,
                    visibility 0.25s ease;
            }

            .sidebar-overlay.open {
                visibility: visible;
                opacity: 1;
            }

            .mobile-menu-button {
                display: grid;
            }

            .desktop-collapse-button {
                display: none;
            }

            .toolbar {
                padding:
                    env(safe-area-inset-top)
                    9px
                    0;
            }

            .game-stage {
                padding: 0;
            }

            .frame-shell {
                border: 0;
                border-radius: 0;
            }

            .action-button {
                width: 39px;
                height: 39px;
                padding: 0;
            }

            .action-button .button-label {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .toolbar {
                gap: 6px;
            }

            .toolbar-left {
                gap: 7px;
            }

            .toolbar-actions {
                gap: 5px;
            }

            .icon-button,
            .action-button {
                width: 36px;
                height: 36px;
                border-radius: 10px;
            }

            .title-label {
                display: none;
            }

            #currentTitle {
                max-width: 40vw;
                font-size: 13px;
            }

            .new-window-button {
                display: none;
            }

            .welcome-description {
                font-size: 13px;
            }

            .welcome-hint {
                font-size: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
<div class="background-grid"></div>
<div class="background-glow one"></div>
<div class="background-glow two"></div>

<div class="app">

    <!-- 게임 목록 -->
    <aside id="sidebar" class="sidebar">

        <header class="sidebar-header">
            <div class="brand">
                <div class="brand-logo">M</div>

                <div class="brand-text">
                    <h1 class="brand-title">
                        물티슈 <strong>ARCADE</strong>
                    </h1>

                    <div class="brand-subtitle">
                        HTML GAME STATION
                    </div>
                </div>
            </div>

            <div class="sidebar-summary">
                <div class="game-count">
                    <span class="game-count-dot"></span>
                    <span id="gameCount">게임 확인 중</span>
                </div>

                <a
                    class="github-link"
                    href="https://github.com/kei-soft/muttisu-game"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    GitHub ↗
                </a>
            </div>
        </header>

        <div class="search-area">
            <div class="search-box">
                <span class="search-icon">⌕</span>

                <input
                    id="gameSearch"
                    type="search"
                    placeholder="게임 검색..."
                    autocomplete="off"
                    aria-label="게임 검색"
                >

                <button
                    id="clearSearchButton"
                    class="clear-search"
                    type="button"
                    aria-label="검색 내용 지우기"
                >
                    ×
                </button>
            </div>
        </div>

        <div class="list-label">
            GAME LIBRARY
        </div>

        <ul id="gameList">
            <li class="status">
                <span class="status-icon">🎮</span>
                게임 목록을 불러오는 중입니다.
            </li>
        </ul>

        <footer class="sidebar-footer">
            <div class="online-status">
                <span class="online-dot"></span>
                ONLINE
            </div>

            <span>POWERED BY GITHUB</span>
        </footer>
    </aside>

    <!-- 모바일 메뉴 배경 -->
    <div
        id="sidebarOverlay"
        class="sidebar-overlay"
    ></div>

    <!-- 메인 게임 영역 -->
    <main class="content">

        <header class="toolbar">

            <div class="toolbar-left">

                <button
                    class="icon-button mobile-menu-button"
                    type="button"
                    aria-label="게임 목록 열기"
                    title="게임 목록"
                    onclick="toggleMobileSidebar()"
                >
                    ☰
                </button>

                <button
                    class="icon-button desktop-collapse-button"
                    type="button"
                    aria-label="사이드바 접기"
                    title="사이드바 접기"
                    onclick="toggleDesktopSidebar()"
                >
                    ❮
                </button>

                <div class="title-area">
                    <span class="title-label">
                        NOW PLAYING
                    </span>

                    <span id="currentTitle">
                        게임을 선택하세요
                    </span>
                </div>
            </div>

            <div class="toolbar-actions">

                <button
                    class="action-button"
                    type="button"
                    title="게임 새로고침"
                    onclick="reloadGame()"
                >
                    <span class="button-icon">↻</span>
                    <span class="button-label">새로고침</span>
                </button>

                <button
                    class="action-button new-window-button"
                    type="button"
                    title="새 창에서 열기"
                    onclick="openNewWindow()"
                >
                    <span class="button-icon">↗</span>
                    <span class="button-label">새 창</span>
                </button>

                <button
                    class="action-button primary"
                    type="button"
                    title="전체화면"
                    onclick="toggleFullscreen()"
                >
                    <span class="button-icon">⛶</span>
                    <span class="button-label">전체화면</span>
                </button>

            </div>
        </header>

        <section class="game-stage">
            <div id="frameShell" class="frame-shell">

                <div id="welcomeScreen" class="welcome-screen">
                    <div class="welcome-content">
                        <div class="welcome-icon">🎮</div>

                        <h2 class="welcome-title">
                            물티슈 GAME ARCADE
                        </h2>

                        <p class="welcome-description">
                            왼쪽 게임 목록에서 플레이할 게임을 선택하세요.<br>
                            모바일에서는 상단의 메뉴 버튼을 눌러 게임을 고를 수 있습니다.
                        </p>

                        <div class="welcome-hint">
                            <span>◀</span>
                            게임을 선택하면 바로 시작됩니다
                        </div>
                    </div>
                </div>

                <div id="loadingOverlay" class="loading-overlay">
                    <div class="loader">
                        <div class="loader-ring"></div>
                        <div class="loader-text">GAME LOADING</div>
                        <div class="loader-subtext">
                            잠시만 기다려 주세요
                        </div>
                    </div>
                </div>

                <iframe
                    id="gameFrame"
                    title="게임 실행 화면"
                    allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
                    allowfullscreen
                ></iframe>
            </div>
        </section>

    </main>
</div>

<script>
    /*
     * GitHub 저장소 설정
     */
    const OWNER = "kei-soft";
    const REPOSITORY = "muttisu-game";
    const BRANCH = "main";

    /*
     * HTML 파일이 저장소 루트에 있으면 빈 문자열입니다.
     * games 폴더에 있다면 "games"로 변경하세요.
     */
    const HTML_DIRECTORY = "";

    /*
     * 페이지가 열렸을 때 첫 번째 게임을 자동 실행할지 여부
     *
     * true  : 첫 번째 게임 자동 실행
     * false : 시작 안내 화면 표시
     */
    const AUTO_PLAY_FIRST_GAME = true;

    const gameListElement =
        document.getElementById("gameList");

    const gameFrame =
        document.getElementById("gameFrame");

    const frameShell =
        document.getElementById("frameShell");

    const currentTitle =
        document.getElementById("currentTitle");

    const gameCount =
        document.getElementById("gameCount");

    const sidebar =
        document.getElementById("sidebar");

    const sidebarOverlay =
        document.getElementById("sidebarOverlay");

    const gameSearch =
        document.getElementById("gameSearch");

    const clearSearchButton =
        document.getElementById("clearSearchButton");

    const loadingOverlay =
        document.getElementById("loadingOverlay");

    const welcomeScreen =
        document.getElementById("welcomeScreen");

    let htmlFiles = [];
    let currentGameUrl = "";
    let currentGamePath = "";
    let loadTimeout = null;

    /**
     * GitHub API에서 HTML 파일 목록을 가져옵니다.
     */
    async function loadGameList() {
        showListStatus(
            "🎮",
            "게임 목록을 불러오는 중입니다."
        );

        try {
            const directoryPath = encodeDirectoryPath(
                HTML_DIRECTORY
            );

            const apiUrl =
                `https://api.github.com/repos/` +
                `${encodeURIComponent(OWNER)}/` +
                `${encodeURIComponent(REPOSITORY)}/contents` +
                `${directoryPath}` +
                `?ref=${encodeURIComponent(BRANCH)}`;

            const response = await fetch(apiUrl, {
                headers: {
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28"
                },
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error(
                    `GitHub API 오류: ${response.status}`
                );
            }

            const files = await response.json();

            if (!Array.isArray(files)) {
                throw new Error(
                    "파일 목록의 형식이 올바르지 않습니다."
                );
            }

            htmlFiles = files
                .filter(file => {
                    const lowerName =
                        file.name.toLowerCase();

                    return (
                        file.type === "file" &&
                        lowerName.endsWith(".html") &&
                        lowerName !== "index.html"
                    );
                })
                .sort((a, b) =>
                    a.name.localeCompare(
                        b.name,
                        "ko",
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    )
                );

            gameCount.textContent =
                `${htmlFiles.length} GAMES`;

            renderGameList(htmlFiles);
            openInitialGame();

        } catch (error) {
            console.error(error);

            gameCount.textContent = "LOAD ERROR";

            showListStatus(
                "⚠️",
                "게임 목록을 불러오지 못했습니다.<br>" +
                "저장소와 GitHub Pages 설정을 확인해 주세요."
            );
        }
    }

    /**
     * HTML_DIRECTORY 경로를 API용으로 변환합니다.
     */
    function encodeDirectoryPath(directory) {
        const encoded = directory
            .split("/")
            .map(part => part.trim())
            .filter(Boolean)
            .map(part => encodeURIComponent(part))
            .join("/");

        return encoded ? `/${encoded}` : "";
    }

    /**
     * 게임 목록을 화면에 표시합니다.
     */
    function renderGameList(files) {
        gameListElement.innerHTML = "";

        if (files.length === 0) {
            showListStatus(
                "🔍",
                gameSearch.value.trim()
                    ? "검색 결과가 없습니다."
                    : "실행할 HTML 게임이 없습니다."
            );

            return;
        }

        files.forEach((file, index) => {
            const item =
                document.createElement("li");

            item.className = "game-item";

            const button =
                document.createElement("button");

            button.type = "button";
            button.className = "game-button";
            button.dataset.path = file.path;

            const numberText =
                String(index + 1).padStart(2, "0");

            button.innerHTML = `
                <span class="game-number">
                    ${numberText}
                </span>

                <span class="game-info">
                    <span class="game-name"></span>
                    <span class="game-type">
                        HTML ARCADE GAME
                    </span>
                </span>

                <span class="play-symbol">
                    ▶
                </span>
            `;

            button
                .querySelector(".game-name")
                .textContent =
                    makeDisplayName(file.name);

            button.addEventListener("click", () => {
                selectGame(file, button);
            });

            item.appendChild(button);
            gameListElement.appendChild(item);
        });

        updateActiveButton();
    }

    /**
     * 게임 목록 상태 문구를 표시합니다.
     */
    function showListStatus(icon, message) {
        gameListElement.innerHTML = `
            <li class="status">
                <span class="status-icon">${icon}</span>
                ${message}
            </li>
        `;
    }

    /**
     * 처음 열 게임을 결정합니다.
     */
    function openInitialGame() {
        if (htmlFiles.length === 0) {
            return;
        }

        const hashPath = getHashGamePath();

        const savedPath =
            localStorage.getItem(
                "muttisu-arcade-last-game"
            );

        let targetFile = null;

        if (hashPath) {
            targetFile = htmlFiles.find(
                file => file.path === hashPath
            );
        }

        if (!targetFile && savedPath) {
            targetFile = htmlFiles.find(
                file => file.path === savedPath
            );
        }

        if (!targetFile && AUTO_PLAY_FIRST_GAME) {
            targetFile = htmlFiles[0];
        }

        if (!targetFile) {
            welcomeScreen.classList.remove("hidden");
            return;
        }

        const targetButton =
            findButtonByPath(targetFile.path);

        selectGame(targetFile, targetButton);
    }

    /**
     * 게임을 선택하고 iframe에서 실행합니다.
     */
    function selectGame(file, selectedButton) {
        if (!file) {
            return;
        }

        currentGamePath = file.path;
        currentGameUrl = buildGameUrl(file.path);

        currentTitle.textContent =
            makeDisplayName(file.name);

        localStorage.setItem(
            "muttisu-arcade-last-game",
            file.path
        );

        setHashGamePath(file.path);

        welcomeScreen.classList.add("hidden");
        showLoading();

        gameFrame.src = currentGameUrl;

        document
            .querySelectorAll(".game-button")
            .forEach(button =>
                button.classList.remove("active")
            );

        if (selectedButton) {
            selectedButton.classList.add("active");
            selectedButton.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });
        }

        if (window.innerWidth <= 850) {
            closeMobileSidebar();
        }
    }

    /**
     * 현재 페이지 기준으로 게임 파일 주소를 만듭니다.
     */
    function buildGameUrl(filePath) {
        const encodedPath = filePath
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/");

        return new URL(
            encodedPath,
            window.location.href.split("#")[0]
        ).href;
    }

    /**
     * 파일명을 표시용 이름으로 변환합니다.
     */
    function makeDisplayName(fileName) {
        return fileName
            .replace(/\.html$/i, "")
            .replace(/[_-]+/g, " ")
            .trim();
    }

    /**
     * 검색합니다.
     */
    function filterGames() {
        const keyword =
            gameSearch.value
                .trim()
                .toLocaleLowerCase("ko");

        clearSearchButton.classList.toggle(
            "visible",
            keyword.length > 0
        );

        const filteredFiles = htmlFiles.filter(file => {
            const displayName =
                makeDisplayName(file.name)
                    .toLocaleLowerCase("ko");

            return (
                displayName.includes(keyword) ||
                file.name
                    .toLocaleLowerCase("ko")
                    .includes(keyword)
            );
        });

        renderGameList(filteredFiles);

        if (keyword) {
            gameCount.textContent =
                `${filteredFiles.length} / ${htmlFiles.length}`;
        } else {
            gameCount.textContent =
                `${htmlFiles.length} GAMES`;
        }
    }

    /**
     * 현재 선택 게임 표시를 복원합니다.
     */
    function updateActiveButton() {
        if (!currentGamePath) {
            return;
        }

        const button =
            findButtonByPath(currentGamePath);

        if (button) {
            button.classList.add("active");
        }
    }

    /**
     * 파일 경로에 해당하는 버튼을 찾습니다.
     */
    function findButtonByPath(path) {
        return Array
            .from(
                document.querySelectorAll(
                    ".game-button"
                )
            )
            .find(
                button =>
                    button.dataset.path === path
            );
    }

    /**
     * 게임 로딩 표시
     */
    function showLoading() {
        window.clearTimeout(loadTimeout);

        loadingOverlay.classList.add("visible");

        /*
         * 게임 자체가 load 이벤트를 발생시키지 못하는 경우를
         * 대비해 10초 뒤에는 로딩 화면을 자동으로 닫습니다.
         */
        loadTimeout = window.setTimeout(() => {
            hideLoading();
        }, 10000);
    }

    function hideLoading() {
        window.clearTimeout(loadTimeout);
        loadingOverlay.classList.remove("visible");
    }

    /**
     * 게임 새로고침
     */
    function reloadGame() {
        if (!currentGameUrl) {
            return;
        }

        showLoading();

        gameFrame.src = "about:blank";

        window.setTimeout(() => {
            gameFrame.src = currentGameUrl;
        }, 80);
    }

    /**
     * 새 창에서 게임 실행
     */
    function openNewWindow() {
        if (!currentGameUrl) {
            return;
        }

        window.open(
            currentGameUrl,
            "_blank",
            "noopener,noreferrer"
        );
    }

    /**
     * 전체화면 전환
     */
    async function toggleFullscreen() {
        try {
            if (!document.fullscreenElement) {
                await frameShell.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        } catch (error) {
            console.error(
                "전체화면 전환 실패:",
                error
            );
        }
    }

    /**
     * PC 사이드바 접기
     */
    function toggleDesktopSidebar() {
        document.body.classList.toggle(
            "sidebar-collapsed"
        );
    }

    /**
     * 모바일 사이드바 열기/닫기
     */
    function toggleMobileSidebar() {
        const isOpen =
            sidebar.classList.toggle("open");

        sidebarOverlay.classList.toggle(
            "open",
            isOpen
        );
    }

    function closeMobileSidebar() {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("open");
    }

    /**
     * 주소 해시 처리
     */
    function getHashGamePath() {
        const rawHash =
            window.location.hash.replace(/^#/, "");

        if (!rawHash) {
            return "";
        }

        try {
            return decodeURIComponent(rawHash);
        } catch {
            return rawHash;
        }
    }

    function setHashGamePath(path) {
        history.replaceState(
            null,
            "",
            `#${encodeURIComponent(path)}`
        );
    }

    /*
     * 이벤트 등록
     */

    gameFrame.addEventListener(
        "load",
        hideLoading
    );

    gameSearch.addEventListener(
        "input",
        filterGames
    );

    clearSearchButton.addEventListener(
        "click",
        () => {
            gameSearch.value = "";
            filterGames();
            gameSearch.focus();
        }
    );

    sidebarOverlay.addEventListener(
        "click",
        closeMobileSidebar
    );

    document.addEventListener(
        "keydown",
        event => {
            if (event.key === "Escape") {
                closeMobileSidebar();
            }

            /*
             * Ctrl + K 또는 Cmd + K로 게임 검색
             */
            if (
                (event.ctrlKey || event.metaKey) &&
                event.key.toLowerCase() === "k"
            ) {
                event.preventDefault();

                if (window.innerWidth <= 850) {
                    sidebar.classList.add("open");
                    sidebarOverlay.classList.add("open");
                }

                gameSearch.focus();
                gameSearch.select();
            }
        }
    );

    window.addEventListener(
        "resize",
        () => {
            if (window.innerWidth > 850) {
                closeMobileSidebar();
            }
        }
    );

    window.addEventListener(
        "hashchange",
        () => {
            const path = getHashGamePath();

            const file = htmlFiles.find(
                item => item.path === path
            );

            if (!file || file.path === currentGamePath) {
                return;
            }

            selectGame(
                file,
                findButtonByPath(file.path)
            );
        }
    );

    /*
     * 시작
     */
    loadGameList();
</script>
</body>
</html>
