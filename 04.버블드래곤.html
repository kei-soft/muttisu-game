<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>버블 드래곤</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0d0630;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; font-family:'Segoe UI', 'Malgun Gothic', sans-serif;
    color:#fff; user-select:none;
  }
  h1 {
    font-size:28px; letter-spacing:8px; margin:10px 0 4px;
    color:#7ee8fa;
    text-shadow:0 0 12px #2bc0e4, 3px 3px 0 #1a4a6e;
  }
  #hud {
    width:720px; max-width:96vw; display:flex; justify-content:space-between;
    font-size:16px; padding:4px 8px; color:#ffd166;
    text-shadow:1px 1px 0 #000;
  }
  #wrap { position:relative; }
  canvas {
    background:#141046;
    border:4px solid #2bc0e4;
    border-radius:8px;
    box-shadow:0 0 30px rgba(43,192,228,.35);
    max-width:96vw; height:auto;
    image-rendering:pixelated;
  }
  #overlay {
    position:absolute; inset:4px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:rgba(13,6,48,.82); border-radius:6px; text-align:center;
  }
  #overlay h2 { font-size:34px; color:#ffd166; text-shadow:3px 3px 0 #b04a00; }
  #overlay p { font-size:15px; line-height:1.7; color:#cfe9ff; }
  #overlay button {
    font-size:18px; padding:10px 34px; border:none; border-radius:24px;
    background:linear-gradient(180deg,#7ee8fa,#2bc0e4); color:#0d0630;
    font-weight:bold; cursor:pointer; letter-spacing:2px;
    box-shadow:0 4px 0 #17698a;
  }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #17698a; }
  #touch {
    display:none; width:720px; max-width:96vw;
    justify-content:space-between; margin-top:10px;
  }
  .tbtn {
    width:64px; height:64px; border-radius:50%; border:none;
    background:rgba(126,232,250,.25); color:#7ee8fa; font-size:26px;
    touch-action:none;
  }
  @media (pointer:coarse) { #touch { display:flex; } }
  .hint { font-size:12px; color:#8ea9c9; margin-top:6px; }
  #diffRow { display:flex; gap:10px; }
  .diffBtn {
    font-size:15px; padding:8px 18px; border-radius:18px; cursor:pointer;
    border:2px solid #2bc0e4; background:transparent; color:#7ee8fa;
    transition:all .15s;
  }
  .diffBtn.selected {
    background:#2bc0e4; color:#0d0630; font-weight:bold;
    box-shadow:0 0 14px rgba(43,192,228,.6);
  }
  .diffDesc { font-size:13px !important; color:#8ea9c9 !important; min-height:18px; }
</style>
</head>
<body>
<h1>버블 드래곤</h1>
<div id="hud">
  <span id="score">점수 0</span>
  <span id="stage">스테이지 1</span>
  <span id="lives">❤❤❤</span>
</div>
<div id="wrap">
  <canvas id="game" width="720" height="560"></canvas>
  <div id="overlay">
    <h2>버블 드래곤</h2>
    <p>← → 이동 &nbsp;|&nbsp; ↑ 또는 Z 점프 &nbsp;|&nbsp; 스페이스 또는 X 버블 발사<br>
    버블로 몬스터를 가둔 뒤 몸으로 터뜨리세요!<br>
    터진 몬스터는 과일이 됩니다 🍓</p>
    <div id="diffRow">
      <button class="diffBtn" data-diff="easy">😊 쉬움</button>
      <button class="diffBtn selected" data-diff="normal">🙂 보통</button>
      <button class="diffBtn" data-diff="hard">😈 어려움</button>
    </div>
    <p id="diffDesc" class="diffDesc">몬스터 4마리부터 · 생명 3개 · 표준 속도</p>
    <button id="startBtn">게임 시작</button>
  </div>
</div>
<div id="touch">
  <div>
    <button class="tbtn" id="tLeft">◀</button>
    <button class="tbtn" id="tRight">▶</button>
  </div>
  <div>
    <button class="tbtn" id="tJump">⤒</button>
    <button class="tbtn" id="tFire">◉</button>
  </div>
</div>
<div class="hint">몬스터를 모두 잡으면 다음 스테이지로!</div>

<script>
(() => {
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = cvs.width, H = cvs.height;
const TILE = 40;

const scoreEl = document.getElementById('score');
const stageEl = document.getElementById('stage');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

// ---------- 스테이지 맵 (18 x 14), 1 = 플랫폼 ----------
const STAGES = [
[
"111111111111111111",
"1................1",
"1................1",
"1..111......111..1",
"1................1",
"1................1",
"1.....111111.....1",
"1................1",
"1................1",
"1.111........111.1",
"1................1",
"1................1",
"1......1111......1",
"111111......111111"
],
[
"111111111111111111",
"1................1",
"1.....1....1.....1",
"1..11........11..1",
"1................1",
"1......1111......1",
"1................1",
"1.11..........11.1",
"1................1",
"1.....11..11.....1",
"1................1",
"1.11..........11.1",
"1......1111......1",
"111111......111111"
],
[
"111111111111111111",
"1................1",
"1.1..........1...1",
"1...11....11.....1",
"1.......1........1",
"1.11........11...1",
"1......11........1",
"1..........1..11.1",
"1.11.............1",
"1.....11...11....1",
"1.1..............1",
"1........11...11.1",
"1..111...........1",
"111111......111111"
]
];

// ---------- 난이도 ----------
const DIFFS = {
  easy:   { label:'쉬움',   lives:5, baseEnemies:3, addPerStage:0.7, baseSpeed:0.85, speedUp:0.18, bubbleLife:600, fireCd:16, desc:'몬스터 3마리부터 · 생명 5개 · 느린 속도' },
  normal: { label:'보통',   lives:3, baseEnemies:4, addPerStage:1.0, baseSpeed:1.10, speedUp:0.25, bubbleLife:480, fireCd:22, desc:'몬스터 4마리부터 · 생명 3개 · 표준 속도' },
  hard:   { label:'어려움', lives:2, baseEnemies:5, addPerStage:1.3, baseSpeed:1.45, speedUp:0.32, bubbleLife:360, fireCd:26, desc:'몬스터 5마리부터 · 생명 2개 · 빠른 속도 · 점수 1.5배' }
};
let diffKey = 'normal';
let diff = DIFFS[diffKey];

// ---------- 게임 상태 ----------
let stageIdx = 0, score = 0, lives = 3;
let map, enemies, bubbles, fruits, particles, player;
let running = false, stageClearTimer = 0, invincible = 0;
let keys = {};

const GRAV = 0.55;

function solid(cx, cy) {
  if (cy < 0) cy = 0;
  if (cy >= map.length) return true;
  if (cx < 0 || cx >= map[0].length) return true;
  return map[cy][cx] === '1';
}

// ---------- 플레이어 ----------
function newPlayer() {
  return {
    x: W/2 - 14, y: H - TILE - 34, w: 28, h: 32,
    vx: 0, vy: 0, dir: 1, onGround: false,
    fireCd: 0, anim: 0
  };
}

// ---------- 몬스터 배치 ----------
function spawnEnemies(n, speed) {
  const list = [];
  const spots = [];
  for (let r = 1; r < map.length - 1; r++)
    for (let c = 1; c < map[0].length - 1; c++)
      if (map[r][c] === '.' && map[r+1] && map[r+1][c] === '1')
        spots.push({c, r});
  for (let i = 0; i < n; i++) {
    const s = spots[Math.floor(Math.random() * spots.length)];
    if (!s || s.r > map.length - 3 && Math.abs(s.c*TILE - W/2) < 100) { i--; continue; }
    list.push({
      x: s.c*TILE + 6, y: s.r*TILE + 8, w: 28, h: 30,
      vx: (Math.random() < .5 ? -1 : 1) * speed, vy: 0,
      trapped: false, anim: Math.random()*10,
      hue: [0, 120, 280, 30][i % 4]
    });
  }
  return list;
}

function loadStage(idx) {
  map = STAGES[idx % STAGES.length];
  const speed = diff.baseSpeed + idx * diff.speedUp;
  const count = Math.round(diff.baseEnemies + Math.min(idx, 5) * diff.addPerStage);
  enemies = spawnEnemies(count, speed);
  bubbles = []; fruits = []; particles = [];
  player = newPlayer();
  stageClearTimer = 0;
  invincible = 90;
  stageEl.textContent = '스테이지 ' + (idx + 1);
}

// ---------- 물리 ----------
function moveBody(b) {
  // 수평
  b.x += b.vx;
  let cl = Math.floor(b.x / TILE), cr = Math.floor((b.x + b.w) / TILE);
  let ct = Math.floor(b.y / TILE), cb = Math.floor((b.y + b.h - 1) / TILE);
  if (b.vx < 0 && (solid(cl, ct) || solid(cl, cb))) { b.x = (cl+1)*TILE; b.hitWall = true; }
  else if (b.vx > 0 && (solid(cr, ct) || solid(cr, cb))) { b.x = cr*TILE - b.w; b.hitWall = true; }
  else b.hitWall = false;

  // 수직
  b.vy += GRAV;
  if (b.vy > 12) b.vy = 12;
  b.y += b.vy;
  cl = Math.floor(b.x / TILE); cr = Math.floor((b.x + b.w) / TILE);
  ct = Math.floor(b.y / TILE); cb = Math.floor((b.y + b.h) / TILE);
  b.onGround = false;
  if (b.vy > 0 && (solid(cl, cb) || solid(cr, cb))) {
    b.y = cb*TILE - b.h; b.vy = 0; b.onGround = true;
  } else if (b.vy < 0 && (solid(cl, ct) || solid(cr, ct))) {
    b.y = (ct+1)*TILE; b.vy = 0;
  }
  // 바닥 아래로 떨어지면 위로 순환
  if (b.y > H) b.y = -b.h;
}

function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------- 업데이트 ----------
function update() {
  if (!running) return;

  // --- 플레이어 ---
  const p = player;
  const acc = 0.7, maxV = 3.6;
  if (keys.left)  { p.vx = Math.max(p.vx - acc, -maxV); p.dir = -1; }
  else if (keys.right) { p.vx = Math.min(p.vx + acc, maxV); p.dir = 1; }
  else p.vx *= 0.75;

  if (keys.jump && p.onGround) { p.vy = -10.5; keys.jump = false; sfx('jump'); }
  moveBody(p);
  p.anim += Math.abs(p.vx) * 0.15;
  if (p.fireCd > 0) p.fireCd--;
  if (invincible > 0) invincible--;

  if (keys.fire && p.fireCd === 0) {
    bubbles.push({
      x: p.x + (p.dir > 0 ? p.w : -22), y: p.y + 4,
      w: 24, h: 24, vx: p.dir * 6, life: 0, phase: 'shoot',
      captured: null, wobble: Math.random()*6.28
    });
    p.fireCd = diff.fireCd;
    sfx('bubble');
  }

  // --- 버블 ---
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.life++;
    b.wobble += 0.08;
    if (b.phase === 'shoot') {
      b.x += b.vx;
      b.vx *= 0.93;
      if (Math.abs(b.vx) < 1.2 || b.life > 40) b.phase = 'float';
      // 벽 충돌
      const cx1 = Math.floor(b.x / TILE), cx2 = Math.floor((b.x+b.w) / TILE);
      const cy = Math.floor((b.y + b.h/2) / TILE);
      if (solid(b.vx < 0 ? cx1 : cx2, cy)) { b.vx = 0; b.phase = 'float'; }
      // 몬스터 포획
      if (!b.captured) {
        for (const e of enemies) {
          if (!e.trapped && overlap(b, e)) {
            e.trapped = true; b.captured = e; b.phase = 'float';
            b.w = 34; b.h = 34; sfx('trap');
            break;
          }
        }
      }
    } else {
      // 위로 떠오름
      b.y -= b.captured ? 0.6 : 1.0;
      b.x += Math.sin(b.wobble) * 0.5;
      const ct = Math.floor(b.y / TILE);
      const cx = Math.floor((b.x + b.w/2) / TILE);
      if (solid(cx, ct)) b.y = (ct+1)*TILE;
    }
    if (b.captured) { b.captured.x = b.x + 3; b.captured.y = b.y + 2; }

    // 수명 만료 → 몬스터 탈출
    const maxLife = b.captured ? diff.bubbleLife : 240;
    if (b.life > maxLife) {
      if (b.captured) { b.captured.trapped = false; b.captured.vy = -3; }
      pop(b.x + b.w/2, b.y + b.h/2, '#9be8ff');
      bubbles.splice(i, 1);
      continue;
    }

    // 플레이어와 접촉
    if (overlap(p, b)) {
      if (b.captured) {
        // 몬스터 처치 → 과일
        const e = b.captured;
        enemies.splice(enemies.indexOf(e), 1);
        fruits.push({
          x: e.x, y: e.y, w: 24, h: 24, vx: (Math.random()-.5)*4, vy: -5,
          kind: Math.floor(Math.random()*5), taken: false, life: 0
        });
        score += diffKey === 'hard' ? 150 : 100; sfx('popEnemy');
        pop(b.x + b.w/2, b.y + b.h/2, '#ffd166');
        bubbles.splice(i, 1);
      } else if (b.phase === 'float' && p.vy > 0 && p.y + p.h < b.y + b.h/2 + 8) {
        // 버블 밟고 점프
        p.vy = -11; sfx('jump');
        pop(b.x + b.w/2, b.y + b.h/2, '#9be8ff');
        bubbles.splice(i, 1);
      }
    }
  }

  // --- 몬스터 ---
  for (const e of enemies) {
    if (e.trapped) continue;
    e.anim += 0.15;
    if (e.hitWall || (e.onGround && Math.random() < 0.005)) e.vx = -e.vx;
    // 낭떠러지에서 가끔 점프
    if (e.onGround && Math.random() < 0.008) e.vy = -9;
    moveBody(e);
    // 플레이어 충돌
    if (invincible === 0 && overlap(p, e)) hurt();
  }

  // --- 과일 ---
  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    f.life++;
    moveBody(f);
    f.vx *= 0.95;
    if (overlap(p, f)) {
      score += diffKey === 'hard' ? 450 : 300; sfx('fruit');
      pop(f.x + 12, f.y + 12, '#ff7bac');
      fruits.splice(i, 1);
    } else if (f.life > 600) fruits.splice(i, 1);
  }

  // --- 파티클 ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.x += q.vx; q.y += q.vy; q.vy += 0.15; q.life--;
    if (q.life <= 0) particles.splice(i, 1);
  }

  // --- 클리어 판정 ---
  if (enemies.length === 0 && fruits.length === 0) {
    stageClearTimer++;
    if (stageClearTimer > 90) {
      stageIdx++;
      loadStage(stageIdx);
    }
  }

  scoreEl.textContent = '점수 ' + score;
}

function hurt() {
  lives--;
  livesEl.textContent = '❤'.repeat(Math.max(lives,0)) || '💀';
  sfx('hurt');
  pop(player.x + 14, player.y + 16, '#ff5c5c');
  if (lives <= 0) {
    running = false;
    showOverlay('게임 오버', '난이도: ' + diff.label + '<br>최종 점수: ' + score + '점<br>스테이지 ' + (stageIdx+1) + '까지 도달했습니다.', '다시 시작');
  } else {
    player = newPlayer();
    invincible = 120;
  }
}

function pop(x, y, color) {
  for (let i = 0; i < 10; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-.5)*5, vy: (Math.random()-.7)*5,
      life: 20 + Math.random()*15, color
    });
  }
}

// ---------- 렌더링 ----------
function draw() {
  // 배경
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#141046');
  g.addColorStop(1, '#1d1560');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 별
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  for (let i = 0; i < 30; i++) {
    const sx = (i * 137) % W, sy = (i * 89) % H;
    if (!solid(Math.floor(sx/TILE), Math.floor(sy/TILE)))
      ctx.fillRect(sx, sy, 2, 2);
  }

  // 타일
  for (let r = 0; r < map.length; r++) {
    for (let c = 0; c < map[0].length; c++) {
      if (map[r][c] !== '1') continue;
      const x = c*TILE, y = r*TILE;
      ctx.fillStyle = '#3d5af1';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#5a76ff';
      ctx.fillRect(x, y, TILE, 6);
      ctx.fillStyle = '#2a3eb1';
      ctx.fillRect(x, y + TILE - 5, TILE, 5);
      ctx.strokeStyle = 'rgba(0,0,0,.25)';
      ctx.strokeRect(x + .5, y + .5, TILE - 1, TILE - 1);
    }
  }

  // 과일
  const fruitEmoji = ['🍓','🍌','🍇','🍎','🍒'];
  ctx.font = '22px serif';
  for (const f of fruits) {
    ctx.fillText(fruitEmoji[f.kind], f.x, f.y + 20);
  }

  // 몬스터
  for (const e of enemies) drawEnemy(e);

  // 버블
  for (const b of bubbles) {
    const cx = b.x + b.w/2, cy = b.y + b.h/2, rr = b.w/2;
    ctx.beginPath();
    ctx.arc(cx, cy, rr, 0, 6.29);
    ctx.fillStyle = b.captured ? 'rgba(180,240,255,.30)' : 'rgba(155,232,255,.22)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(190,245,255,.9)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx - rr*0.35, cy - rr*0.35, rr*0.22, 0, 6.29);
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.fill();
  }

  // 플레이어
  drawPlayer(player);

  // 파티클
  for (const q of particles) {
    ctx.globalAlpha = Math.max(q.life / 30, 0);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x, q.y, 4, 4);
    ctx.globalAlpha = 1;
  }

  // 클리어 메시지
  if (enemies.length === 0 && running && stageClearTimer > 10) {
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd166';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 5;
    ctx.strokeText('스테이지 클리어!', W/2, H/2);
    ctx.fillText('스테이지 클리어!', W/2, H/2);
    ctx.textAlign = 'left';
  }
}

function drawPlayer(p) {
  if (invincible > 0 && Math.floor(invincible / 5) % 2 === 0) return;
  const x = p.x, y = p.y;
  ctx.save();
  ctx.translate(x + p.w/2, y + p.h/2);
  ctx.scale(p.dir, 1);
  ctx.translate(-p.w/2, -p.h/2);

  // 몸통 (초록 아기 공룡)
  ctx.fillStyle = '#5ad469';
  roundRect(2, 8, 24, 22, 9);
  // 배
  ctx.fillStyle = '#c9f7cf';
  roundRect(7, 16, 14, 12, 6);
  // 머리 볼
  ctx.fillStyle = '#5ad469';
  ctx.beginPath(); ctx.arc(20, 10, 9, 0, 6.29); ctx.fill();
  // 눈
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(22, 7, 4.2, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(23.5, 7, 2, 0, 6.29); ctx.fill();
  // 등 가시
  ctx.fillStyle = '#2fa24a';
  ctx.beginPath();
  ctx.moveTo(4, 10); ctx.lineTo(0, 5); ctx.lineTo(7, 7); ctx.fill();
  // 다리 (걷기 애니메이션)
  const legOff = p.onGround ? Math.sin(p.anim) * 3 : 2;
  ctx.fillStyle = '#3fbf55';
  roundRect(5 + legOff, 27, 7, 5, 2);
  roundRect(16 - legOff, 27, 7, 5, 2);
  ctx.restore();
}

function drawEnemy(e) {
  const x = e.x, y = e.y;
  ctx.save();
  ctx.translate(x + e.w/2, y + e.h/2);
  ctx.scale(e.vx >= 0 ? 1 : -1, 1);
  ctx.translate(-e.w/2, -e.h/2);
  const bob = e.trapped ? 0 : Math.sin(e.anim) * 1.5;

  // 몸통
  ctx.fillStyle = `hsl(${e.hue},75%,60%)`;
  roundRect(2, 6 + bob, 24, 22, 10);
  // 뿔
  ctx.fillStyle = `hsl(${e.hue},70%,42%)`;
  ctx.beginPath();
  ctx.moveTo(8, 8 + bob); ctx.lineTo(6, 1 + bob); ctx.lineTo(12, 6 + bob); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(18, 8 + bob); ctx.lineTo(22, 1 + bob); ctx.lineTo(16, 6 + bob); ctx.fill();
  // 눈
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(11, 13 + bob, 4, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(20, 13 + bob, 4, 0, 6.29); ctx.fill();
  ctx.fillStyle = e.trapped ? '#66c' : '#c22';
  ctx.beginPath(); ctx.arc(12, 13 + bob, 1.8, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(21, 13 + bob, 1.8, 0, 6.29); ctx.fill();
  // 입
  ctx.strokeStyle = '#502';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  if (e.trapped) ctx.arc(15, 23 + bob, 3, 0, Math.PI, true);
  else ctx.arc(15, 21 + bob, 3.4, 0, Math.PI);
  ctx.stroke();
  // 발
  const legOff = e.trapped ? 0 : Math.sin(e.anim * 1.5) * 2.5;
  ctx.fillStyle = `hsl(${e.hue},70%,42%)`;
  roundRect(4 + legOff, 26 + bob, 7, 4, 2);
  roundRect(17 - legOff, 26 + bob, 7, 4, 2);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();
}

// ---------- 사운드 (Web Audio) ----------
let audioCtx = null;
function sfx(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const gN = audioCtx.createGain();
    o.connect(gN); gN.connect(audioCtx.destination);
    gN.gain.setValueAtTime(0.12, t);
    gN.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    if (type === 'jump') { o.frequency.setValueAtTime(300, t); o.frequency.linearRampToValueAtTime(600, t + .12); }
    else if (type === 'bubble') { o.frequency.setValueAtTime(700, t); o.frequency.linearRampToValueAtTime(900, t + .08); o.type = 'sine'; }
    else if (type === 'trap') { o.frequency.setValueAtTime(500, t); o.frequency.linearRampToValueAtTime(950, t + .18); o.type = 'triangle'; }
    else if (type === 'popEnemy') { o.frequency.setValueAtTime(900, t); o.frequency.linearRampToValueAtTime(250, t + .2); o.type = 'square'; gN.gain.setValueAtTime(0.08, t); }
    else if (type === 'fruit') { o.frequency.setValueAtTime(800, t); o.frequency.setValueAtTime(1200, t + .07); o.type = 'sine'; }
    else if (type === 'hurt') { o.frequency.setValueAtTime(220, t); o.frequency.linearRampToValueAtTime(90, t + .3); o.type = 'sawtooth'; }
    o.start(t); o.stop(t + 0.3);
  } catch (e) {}
}

// ---------- 입력 ----------
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowRight') keys.right = true;
  if (e.key === 'ArrowUp' || e.key === 'z' || e.key === 'Z') keys.jump = true;
  if (e.key === ' ' || e.key === 'x' || e.key === 'X') keys.fire = true;
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === 'z' || e.key === 'Z') keys.jump = false;
  if (e.key === ' ' || e.key === 'x' || e.key === 'X') keys.fire = false;
});
function bindTouch(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); keys[key] = true; });
  el.addEventListener('pointerup', () => keys[key] = false);
  el.addEventListener('pointerleave', () => keys[key] = false);
}
bindTouch('tLeft','left'); bindTouch('tRight','right');
bindTouch('tJump','jump'); bindTouch('tFire','fire');

// ---------- 게임 흐름 ----------
function showOverlay(title, msg, btnText) {
  overlay.querySelector('h2').textContent = title;
  overlay.querySelector('p').innerHTML = msg;
  startBtn.textContent = btnText;
  overlay.style.display = 'flex';
}

const diffDesc = document.getElementById('diffDesc');
document.querySelectorAll('.diffBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diffBtn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    diffKey = btn.dataset.diff;
    diff = DIFFS[diffKey];
    diffDesc.textContent = diff.desc;
  });
});

startBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
  stageIdx = 0; score = 0;
  lives = diff.lives;
  livesEl.textContent = '❤'.repeat(lives);
  loadStage(0);
  running = true;
});

loadStage(0);
draw();

(function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
})();
})();
</script>
