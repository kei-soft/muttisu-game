<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>애완 핵폭탄 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1410;
    --panel:#141d17;
    --panel-edge:#26352a;
    --rad:#c6ff3a;          /* 방사능 그린 */
    --amber:#ffc043;        /* 경고 앰버 */
    --danger:#ff3b2f;       /* 멸망 레드 */
    --ink:#e9f3e4;
    --dim:#7e927e;
    --mono:'Do Hyeon', ui-monospace, 'Courier New', monospace;
    --disp:'Jua', system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:
      radial-gradient(900px 500px at 50% -10%, #1a2a1d 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--disp);
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; padding:14px;
    overflow:hidden;
  }
  #stage{
    width:100%; max-width:430px;
    max-height:calc(100dvh - 20px);
    display:flex; flex-direction:column;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:22px;
    box-shadow:0 0 0 4px #0a0f0c, 0 22px 60px rgba(0,0,0,.6),
               inset 0 1px 0 rgba(255,255,255,.04);
    overflow:hidden;
    position:relative;
  }
  /* 위험 시 화면 흔들림 */
  #stage.shake{animation:shake .28s infinite;}
  @keyframes shake{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-3px,2px)}
    50%{transform:translate(3px,-2px)}
    75%{transform:translate(-2px,-2px)}
  }

  /* ── 상단 바 ── */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; flex-shrink:0;
    border-bottom:1px solid var(--panel-edge);
    background:linear-gradient(#16211a, #131c16);
  }
  .brand{display:flex; align-items:center; gap:8px;}
  .brand .dot{
    width:11px; height:11px; border-radius:50%;
    background:var(--rad); box-shadow:0 0 10px var(--rad);
    animation:beat 1.4s infinite;
  }
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}
  .brand b{font-size:15px; letter-spacing:.5px;}
  .topbar .stat{
    font-family:var(--mono); font-size:12px; color:var(--dim);
    text-align:right; line-height:1.35;
  }
  .topbar .stat .big{color:var(--rad); font-size:15px;}

  /* ── 무대(캔버스) ── */
  .arena{position:relative; flex:1 1 auto; min-height:170px; overflow:hidden;}
  canvas#scene{width:100%; height:100%; display:block;}
  .speech{
    position:absolute; left:50%; top:16px; transform:translateX(-50%);
    max-width:78%;
    background:#fff; color:#16211a;
    padding:9px 14px; border-radius:14px;
    font-size:14px; font-weight:bold; text-align:center;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
    opacity:0; transition:opacity .2s, transform .2s; pointer-events:none;
  }
  .speech::after{
    content:''; position:absolute; left:50%; bottom:-8px; transform:translateX(-50%);
    border:8px solid transparent; border-top-color:#fff; border-bottom:0;
  }
  .speech.show{opacity:1;}
  .speech.demand{background:var(--amber);}
  .countdown{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    font-family:var(--mono); font-size:46px; color:var(--danger);
    text-shadow:0 0 18px rgba(255,59,47,.8);
    opacity:0; transition:opacity .15s;
  }
  .countdown.show{opacity:1; animation:cdpulse .5s infinite;}
  @keyframes cdpulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.14)}}

  /* ── 게이지 ── */
  .gauges{padding:14px 16px 4px; flex-shrink:0;}
  .gauge{margin-bottom:11px;}
  .gauge .lab{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; margin-bottom:5px;
  }
  .gauge .lab .v{font-family:var(--mono); color:var(--dim); font-size:12px;}
  .bar{
    height:13px; background:#0c130e; border-radius:10px; overflow:hidden;
    border:1px solid #223028;
  }
  .bar > span{
    display:block; height:100%; width:50%;
    border-radius:10px; transition:width .25s ease, background .25s;
  }

  /* ── 버튼 ── */
  .actions{
    display:grid; grid-template-columns:repeat(5,1fr); gap:8px;
    padding:10px 14px calc(16px + env(safe-area-inset-bottom));
    flex-shrink:0;
  }
  .btn{
    border:1px solid #3c5546; background:#243528;
    color:#f1f8ec; border-radius:14px; padding:11px 4px 8px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-family:var(--disp); font-size:12px; cursor:pointer;
    transition:transform .08s, background .15s, opacity .15s;
    user-select:none;
  }
  .btn .ico{font-size:22px; line-height:1;}
  .btn:active{transform:scale(.92); background:#30482f;}
  .btn:disabled{opacity:.32; cursor:not-allowed;}
  .btn .cd{
    font-family:var(--mono); font-size:10px; color:var(--amber); height:11px;
  }

  /* ── 오버레이 ── */
  .overlay{
    position:absolute; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px;
    background:radial-gradient(circle at 50% 40%, rgba(20,32,24,.94), rgba(10,16,12,.98));
    backdrop-filter:blur(3px);
  }
  .overlay.hidden{display:none;}
  .overlay h1{font-size:30px; margin:0 0 6px; letter-spacing:1px;}
  .overlay .tag{color:var(--rad); font-size:14px; margin-bottom:18px;}
  .overlay p{color:var(--dim); font-size:13.5px; line-height:1.7; margin:4px 0; max-width:330px;}
  .overlay p b{color:var(--ink);}
  .cta{
    margin-top:22px; padding:14px 34px; border:none; border-radius:30px;
    background:var(--rad); color:#0c1009; font-family:var(--disp); font-size:17px;
    cursor:pointer; box-shadow:0 8px 24px rgba(198,255,58,.32);
    transition:transform .08s;
  }
  .cta:active{transform:scale(.95);}
  .boom-emoji{font-size:70px; margin-bottom:6px;}
  #goStats{font-family:var(--mono); color:var(--amber); font-size:15px; margin:10px 0 0;}
  .mutebtn{
    position:absolute; top:10px; right:12px; z-index:25;
    background:transparent; border:none; color:var(--dim); font-size:18px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="stage">
  <button class="mutebtn" id="muteBtn" title="소리">🔊</button>

  <div class="topbar">
    <div class="brand"><span class="dot"></span><b>애완 핵폭탄</b></div>
    <div class="stat">
      생존 <span class="big" id="timeVal">0초</span><br>
      <span id="dayVal">Day 1</span>
    </div>
  </div>

  <div class="arena">
    <canvas id="scene"></canvas>
    <div class="speech" id="speech"></div>
    <div class="countdown" id="countdown">10</div>
  </div>

  <div class="gauges">
    <div class="gauge">
      <div class="lab"><span>😊 기분</span><span class="v" id="moodV">80</span></div>
      <div class="bar"><span id="moodBar"></span></div>
    </div>
    <div class="gauge">
      <div class="lab"><span>🍖 포만감</span><span class="v" id="fullV">80</span></div>
      <div class="bar"><span id="fullBar"></span></div>
    </div>
    <div class="gauge">
      <div class="lab"><span>🌡️ 노심 온도</span><span class="v" id="heatV">20</span></div>
      <div class="bar"><span id="heatBar"></span></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" data-act="pet"><span class="ico">🤚</span>쓰다듬기<span class="cd" id="cd-pet"></span></button>
    <button class="btn" data-act="feed"><span class="ico">🍖</span>먹이주기<span class="cd" id="cd-feed"></span></button>
    <button class="btn" data-act="play"><span class="ico">🎮</span>놀아주기<span class="cd" id="cd-play"></span></button>
    <button class="btn" data-act="cool"><span class="ico">🧊</span>식혀주기<span class="cd" id="cd-cool"></span></button>
    <button class="btn" data-act="sing"><span class="ico">🎵</span>자장가<span class="cd" id="cd-sing"></span></button>
  </div>

  <!-- 시작 화면 -->
  <div class="overlay" id="startScreen">
    <div class="boom-emoji">💣</div>
    <h1>애완 핵폭탄</h1>
    <div class="tag">— 너의 손에 인류의 운명이 —</div>
    <p>이 귀여운 친구는 <b>기분이 나빠지거나</b> <b>노심이 과열되면</b> 폭발해서 지구를 멸망시킵니다.</p>
    <p>쓰다듬고, 먹이고, 놀아주고, 식혀주고, 자장가를 불러주며 <b>최대한 오래</b> 달래보세요.</p>
    <p style="color:var(--amber)">⚠️ 놀아주거나 먹이면 노심이 뜨거워져요. 균형이 핵심!</p>
    <button class="cta" id="startBtn">달래기 시작</button>
  </div>

  <!-- 게임오버 -->
  <div class="overlay hidden" id="gameOver">
    <div class="boom-emoji">☢️</div>
    <h1 id="goTitle">지구 멸망</h1>
    <div class="tag" id="goReason">노심 용융으로 폭발했습니다</div>
    <p id="goStats">생존 시간: 0초</p>
    <p id="goRank" style="margin-top:14px"></p>
    <button class="cta" id="retryBtn">다시 달래기</button>
  </div>
</div>

<script>
(()=>{
  "use strict";
  const $ = id => document.getElementById(id);
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

  const cv = $('scene'), ctx = cv.getContext('2d');
  let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
  function resize(){
    const r = cv.getBoundingClientRect();
    W=r.width; H=r.height;
    cv.width=W*DPR; cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize);

  // ── 게임 상태 ──
  const ACTIONS = {
    pet : {mood:+6,  full:0,   heat:0,   cd:0.6, say:['헤헤…','좋아♥','부르르~']},
    feed: {mood:+4,  full:+28, heat:+13, cd:2.5, say:['냠냠!','맛있다!','우라늄 최고!']},
    play: {mood:+16, full:-10, heat:+22, cd:2.0, say:['신난다!','한 번 더!','꺄르르!']},
    cool: {mood:-4,  full:0,   heat:-35, cd:3.0, say:['아 시원…','으으 추워','후…']},
    sing: {mood:+12, full:0,   heat:-6,  cd:4.0, say:['음~ 졸려','♪…','스르륵…']},
  };
  const DEMANDS = {
    play:{txt:'심심해! 놀아줘! 🎮'}, feed:{txt:'배고파… 밥 줘! 🍖'},
    cool:{txt:'너무 뜨거워!! 식혀줘! 🧊'}, pet:{txt:'쓰다듬어 줘~ 🤚'},
    sing:{txt:'노래 불러줘 ♪'},
  };

  let S = null;
  function newGame(){
    S = {
      mood:80, full:80, heat:20,
      alive:true, time:0, tick:0,
      cool:{pet:0,feed:0,play:0,cool:0,sing:0},
      meltdown:0, melting:false,
      demand:null, demandTimer:0, demandLeft:0,
      flash:0, sweat:0,
      blink:0, blinkT:Math.random()*3+2,
      reaction:'', reactionT:0, bob:0,
    };
  }

  // ── 사운드 (Web Audio) ──
  let actx=null, muted=false;
  function audio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return actx; }
  function beep(freq,dur,type='square',vol=0.08){
    if(muted) return; const a=audio(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=freq;
    o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.start(); o.stop(a.currentTime+dur);
  }
  function boom(){
    if(muted) return; const a=audio(); if(!a) return;
    const n=a.createBufferSource(), len=a.sampleRate*1.1;
    const buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
    n.buffer=buf;
    const g=a.createGain(); g.gain.setValueAtTime(0.5,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+1.1);
    const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
    n.connect(f); f.connect(g); g.connect(a.destination); n.start();
  }

  // ── UI 헬퍼 ──
  function setBar(barId,valId,v,color){
    $(barId).style.width=v+'%'; $(barId).style.background=color; $(valId).textContent=Math.round(v);
  }
  function moodColor(v){ return v>55?'var(--rad)':v>25?'var(--amber)':'var(--danger)'; }
  function fullColor(v){ return v>40?'#56c0ff':v>20?'var(--amber)':'var(--danger)'; }
  function heatColor(v){ return v<60?'#56c0ff':v<85?'var(--amber)':'var(--danger)'; }

  let speechT=0;
  function say(t,demand=false){
    const el=$('speech'); el.textContent=t;
    el.classList.toggle('demand',demand); el.classList.add('show'); speechT=2.2;
  }

  // ── 액션 처리 ──
  function doAction(act){
    if(!S||!S.alive) return;
    if(S.cool[act]>0) return;
    const a=ACTIONS[act];
    S.mood=clamp(S.mood+a.mood,0,100);
    S.full=clamp(S.full+a.full,0,100);
    S.heat=clamp(S.heat+a.heat,0,100);
    S.cool[act]=a.cd;
    if(act==='cool'){S.sweat=0;}
    S.reaction= act==='play'?'happy': act==='pet'?'love': act==='sing'?'sleepy': act==='cool'?'cool':'eat';
    S.reactionT=0.6;
    say(a.say[(Math.random()*a.say.length)|0]);
    beep(act==='cool'?320:act==='sing'?440:660, 0.12, act==='cool'?'sine':'triangle');

    // 요구 충족 보너스
    if(S.demand===act){
      S.mood=clamp(S.mood+12,0,100);
      say('와아 고마워! ♥',false);
      S.demand=null;
    }
  }
  document.querySelectorAll('.btn[data-act]').forEach(b=>{
    b.addEventListener('click',()=>doAction(b.dataset.act));
  });

  // ── 게임 로직 (0.5초 틱) ──
  const TICK=0.5;
  function logicTick(){
    if(!S.alive) return;
    const d = 1 + S.time/110;          // 시간이 지날수록 어려워짐
    S.full = clamp(S.full - 0.9*d, 0, 100);
    // 온도는 평상시 천천히 식음
    S.heat += (24 - S.heat)*0.04;
    // 기분 감소 요인
    let drop = 0.6*d;                          // 기본 지루함
    if(S.full < 30) drop += (30-S.full)*0.035*d;   // 배고픔
    if(S.heat > 70) drop += (S.heat-70)*0.05*d;    // 과열
    S.mood = clamp(S.mood - drop, 0, 100);
    S.heat = clamp(S.heat,0,100);
    S.sweat = S.heat>72 ? Math.min(1,(S.heat-72)/20) : 0;

    // 요구사항
    if(!S.demand){
      S.demandTimer -= TICK;
      if(S.demandTimer<=0){
        const keys=Object.keys(DEMANDS);
        S.demand=keys[(Math.random()*keys.length)|0];
        S.demandLeft=9;
        say(DEMANDS[S.demand].txt,true);
        beep(880,0.1,'square');
      }
    } else {
      S.demandLeft -= TICK;
      if(S.demandLeft<=0){
        S.mood=clamp(S.mood-9,0,100);   // 무시하면 삐짐
        say('흥! 무시했겠다…',false);
        S.demand=null; S.demandTimer=14+Math.random()*8;
      }
    }
    if(!S.demand && S.demandTimer<=0) S.demandTimer=14+Math.random()*8;
  }

  // ── 멸망 카운트다운 ──
  const MELT=12;
  function updateDanger(dt){
    const danger = S.mood<=15 || S.heat>=93;
    if(danger && !S.melting){
      S.melting=true; S.meltdown=MELT;
    }
    if(S.melting){
      // 회복하면 해제
      if(S.mood>26 && S.heat<88){
        S.melting=false; $('countdown').classList.remove('show');
        $('stage').classList.remove('shake');
        say('휴… 살았다',false); return;
      }
      S.meltdown -= dt;
      const cd=$('countdown'); cd.classList.add('show');
      const n=Math.ceil(S.meltdown); cd.textContent=n>0?n:0;
      $('stage').classList.add('shake');
      // 초마다 삐 소리
      if(Math.ceil(S.meltdown)!==Math.ceil(S.meltdown+dt)) beep(1200,0.08,'square',0.12);
      if(S.meltdown<=0) explode();
    }
  }

  function explode(){
    S.alive=false; S.melting=false;
    $('stage').classList.remove('shake');
    $('countdown').classList.remove('show');
    S.flash=1; boom();
    setTimeout(()=>{
      const reason = S.heat>=90 ? '노심 용융으로 폭발했습니다'
                   : '기분이 바닥나 자폭했습니다';
      $('goReason').textContent=reason;
      $('goStats').textContent='생존 시간: '+fmtTime(S.time)+'  ·  Day '+dayOf(S.time);
      $('goRank').innerHTML=rankText(S.time);
      $('gameOver').classList.remove('hidden');
    },650);
  }

  function fmtTime(t){
    const m=Math.floor(t/60), s=Math.floor(t%60);
    return m>0? m+'분 '+s+'초' : s+'초';
  }
  const dayOf = t => Math.floor(t/20)+1;
  function rankText(t){
    if(t<25)  return '🥉 <b>견습 관리자</b> — 핵폭탄은 인내심이 필요해요!';
    if(t<60)  return '🥈 <b>핵폭탄 보모</b> — 제법인데요?';
    if(t<120) return '🥇 <b>전문 달래미</b> — 인류가 당신에게 빚졌습니다.';
    if(t<240) return '🏆 <b>핵 평화 수호자</b> — 경이로운 솜씨!';
    return '👑 <b>핵폭탄의 어머니</b> — 전설로 기록될 인물.';
  }

  // ── 렌더링 ──
  function draw(){
    ctx.clearRect(0,0,W,H);
    const cx=W/2, cy=H/2+8, t=performance.now()/1000;

    // 위험 배경 글로우
    let danger = S? (S.melting?1: clamp((Math.max(100-S.mood, S.heat))/100,0,1)) : 0;
    const glow = ctx.createRadialGradient(cx,cy,20,cx,cy,W*0.7);
    const gcol = danger>0.7? '255,59,47' : danger>0.45? '255,192,67' : '198,255,58';
    glow.addColorStop(0,`rgba(${gcol},${0.10+danger*0.22+(S&&S.melting?0.15*Math.abs(Math.sin(t*8)):0)})`);
    glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);

    if(!S){ return; }

    // 폭발 플래시
    if(!S.alive){
      if(S.flash>0){
        ctx.fillStyle=`rgba(255,${230*S.flash|0},${160*S.flash|0},${S.flash})`;
        ctx.fillRect(0,0,W,H);
      }
      // 버섯구름 이모지 느낌
      ctx.font='80px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('☢️',cx,cy);
      return;
    }

    // 흔들림(녹는 중)
    let sx=0,sy=0;
    if(S.melting){ sx=(Math.random()-0.5)*5; sy=(Math.random()-0.5)*5; }
    const bob = Math.sin(t*2)*5;
    ctx.save(); ctx.translate(cx+sx, cy+sy+bob);

    const R=72;
    // 그림자
    ctx.beginPath(); ctx.ellipse(0,R+34,R*0.85,14,0,0,7); ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fill();

    // 꼭지(신관)
    ctx.fillStyle='#3a4a3d';
    ctx.fillRect(-9,-R-22,18,24);
    // 깜빡이 램프
    const lamp = danger>0.5? (Math.abs(Math.sin(t*10))>0.5?'#ff3b2f':'#5a1410') : '#c6ff3a';
    ctx.beginPath(); ctx.arc(0,-R-24,7,0,7); ctx.fillStyle=lamp;
    ctx.shadowColor=lamp; ctx.shadowBlur=14; ctx.fill(); ctx.shadowBlur=0;

    // 몸통 (구체)
    const bg=ctx.createRadialGradient(-R*0.35,-R*0.4,8,0,0,R);
    bg.addColorStop(0,'#5c6b5e'); bg.addColorStop(0.6,'#3a473d'); bg.addColorStop(1,'#222c25');
    ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fillStyle=bg; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle='#1a221c'; ctx.stroke();

    // 위험 표시 줄무늬 띠 (아래쪽)
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.clip();
    ctx.translate(-R, R*0.42);
    for(let i=0;i<14;i++){
      ctx.fillStyle = i%2? '#ffc043':'#1a1a1a';
      ctx.beginPath();
      ctx.moveTo(i*12,0); ctx.lineTo(i*12+10,0); ctx.lineTo(i*12+2,18); ctx.lineTo(i*12-8,18);
      ctx.fill();
    }
    ctx.restore();

    // 방사능 마크 (가슴)
    ctx.save(); ctx.translate(0,-6); ctx.globalAlpha=0.25;
    ctx.fillStyle='#0c1009';
    for(let k=0;k<3;k++){ ctx.beginPath(); ctx.moveTo(0,0);
      ctx.arc(0,0,17,(-Math.PI/2)+k*2.094-0.45,(-Math.PI/2)+k*2.094+0.45); ctx.closePath(); ctx.fill(); }
    ctx.beginPath(); ctx.arc(0,0,5,0,7); ctx.fill();
    ctx.restore();

    drawFace(R,t,danger);

    // 땀방울 (과열)
    if(S.sweat>0){
      ctx.fillStyle='rgba(120,200,255,'+ (0.6+0.4*S.sweat) +')';
      const dy=(t*40)% 26;
      [[-30,-18],[34,-10]].forEach(([x,y0])=>{
        ctx.beginPath(); ctx.ellipse(x,y0+dy-30,4,6,0,0,7); ctx.fill();
      });
    }
    ctx.restore();
  }

  function drawFace(R,t,danger){
    const mood=S.mood, heat=S.heat;
    // 눈 깜빡임
    S.blink-=1/60; if(S.blink<-0.12){ S.blink=S.blinkT; }
    const blinking = S.blink<0;
    const ey=-12, ex=24, er=9;

    ctx.fillStyle='#0c1009';
    if(S.reactionT>0 && S.reaction==='love'){
      // 하트 눈
      [-ex,ex].forEach(x=>heart(x,ey,7));
    } else if(S.reactionT>0 && S.reaction==='sleepy'){
      [-ex,ex].forEach(x=>{ctx.beginPath();ctx.moveTo(x-8,ey);ctx.quadraticCurveTo(x,ey+6,x+8,ey);ctx.lineWidth=3;ctx.strokeStyle='#0c1009';ctx.stroke();});
    } else if(mood<25 || danger>0.7){
      // 화난/겁먹은 눈 (찡그림)
      [-ex,ex].forEach((x,i)=>{
        ctx.beginPath(); ctx.arc(x,ey,er,0,7); ctx.fillStyle='#fff'; ctx.fill();
        ctx.beginPath(); ctx.arc(x,ey+3,4,0,7); ctx.fillStyle='#0c1009'; ctx.fill();
        // 눈썹
        ctx.lineWidth=3; ctx.strokeStyle='#0c1009'; ctx.beginPath();
        ctx.moveTo(x-9, ey-12); ctx.lineTo(x+9, ey-6+(i?0:0)); ctx.stroke();
      });
    } else if(blinking){
      [-ex,ex].forEach(x=>{ctx.lineWidth=3;ctx.strokeStyle='#0c1009';ctx.beginPath();ctx.moveTo(x-8,ey);ctx.lineTo(x+8,ey);ctx.stroke();});
    } else {
      [-ex,ex].forEach(x=>{
        ctx.beginPath(); ctx.arc(x,ey,er,0,7); ctx.fillStyle='#fff'; ctx.fill();
        ctx.beginPath(); ctx.arc(x+1.5,ey+1.5,4.2,0,7); ctx.fillStyle='#0c1009'; ctx.fill();
        ctx.beginPath(); ctx.arc(x-1,ey-1,1.6,0,7); ctx.fillStyle='#fff'; ctx.fill();
      });
    }

    // 볼터치
    ctx.fillStyle='rgba(255,120,120,'+ (mood>55?0.5:0.25) +')';
    [-34,34].forEach(x=>{ctx.beginPath(); ctx.ellipse(x,8,9,5,0,0,7); ctx.fill();});

    // 입
    ctx.lineWidth=3.5; ctx.strokeStyle='#0c1009'; ctx.fillStyle='#0c1009';
    const my=22;
    if(S.reactionT>0 && S.reaction==='eat'){
      ctx.beginPath(); ctx.arc(0,my,10,0,Math.PI*2); ctx.fillStyle='#7a1f1f'; ctx.fill();
    } else if(mood>65){
      ctx.beginPath(); ctx.arc(0,my-2,13,0.15*Math.PI,0.85*Math.PI); ctx.stroke(); // 큰 웃음
    } else if(mood>35){
      ctx.beginPath(); ctx.moveTo(-12,my); ctx.quadraticCurveTo(0,my+7,12,my); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-12,my+5); ctx.quadraticCurveTo(0,my-5,12,my+5); ctx.stroke(); // 찡그림
    }
  }
  function heart(x,y,s){
    ctx.fillStyle='#ff4d6d'; ctx.beginPath();
    ctx.moveTo(x,y+s*0.7);
    ctx.bezierCurveTo(x+s,y-s*0.6,x+s*1.4,y+s*0.3,x,y+s*1.2);
    ctx.bezierCurveTo(x-s*1.4,y+s*0.3,x-s,y-s*0.6,x,y+s*0.7);
    ctx.fill();
  }

  // ── 메인 루프 ──
  let last=0, tickAcc=0, running=false;
  function loop(ts){
    if(!running){ return; }
    const now=ts/1000; let dt=last? now-last:0; last=now; if(dt>0.1)dt=0.1;
    if(S && S.alive){
      S.time+=dt;
      tickAcc+=dt;
      while(tickAcc>=TICK){ logicTick(); tickAcc-=TICK; }
      updateDanger(dt);
      // 쿨다운
      for(const k in S.cool){ if(S.cool[k]>0) S.cool[k]=Math.max(0,S.cool[k]-dt); }
      if(S.reactionT>0) S.reactionT-=dt;
      if(speechT>0){ speechT-=dt; if(speechT<=0) $('speech').classList.remove('show'); }
      syncUI();
    }
    if(S && !S.alive && S.flash>0) S.flash=Math.max(0,S.flash-dt*1.4);
    draw();
    requestAnimationFrame(loop);
  }

  function syncUI(){
    setBar('moodBar','moodV',S.mood,moodColor(S.mood));
    setBar('fullBar','fullV',S.full,fullColor(S.full));
    setBar('heatBar','heatV',S.heat,heatColor(S.heat));
    $('timeVal').textContent=fmtTime(S.time);
    $('dayVal').textContent='Day '+dayOf(S.time);
    document.querySelectorAll('.btn[data-act]').forEach(b=>{
      const k=b.dataset.act, c=S.cool[k];
      b.disabled = c>0;
      $('cd-'+k).textContent = c>0 ? c.toFixed(1)+'s' : '';
      b.style.outline = (S.demand===k)?'2px solid var(--amber)':'none';
    });
  }

  // ── 시작/재시작 ──
  function start(){
    newGame(); resize();
    $('startScreen').classList.add('hidden');
    $('gameOver').classList.add('hidden');
    syncUI();
    if(!running){ running=true; last=0; tickAcc=0; requestAnimationFrame(loop); }
    audio(); // 사용자 제스처에서 오디오 컨텍스트 활성화
  }
  $('startBtn').addEventListener('click',start);
  $('retryBtn').addEventListener('click',start);
  $('muteBtn').addEventListener('click',()=>{
    muted=!muted; $('muteBtn').textContent=muted?'🔇':'🔊';
  });

  // 초기 렌더(시작 화면 뒤 배경)
  resize(); newGame(); S=null; running=true;
  requestAnimationFrame(loop);
})();
</script>
</body>
